<style>

html,

0 0 34px rgba(80,200,255,.45),

12px 18px;

.devBtn:hover{

#9de4ff;

0 0 20px

135deg,

rgba(120,220,255,.5)

rgba(80,230,170,.45);

rgba(255,100,100,.3);

1px solid

/* =========================================

10px auto;

>

<script>

(function(){

"use strict";


/* =====================================================
   MAIN ELEMENTS
===================================================== */

const canvas =
document.getElementById("orb");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const heard =
document.getElementById("heard");

const mic =
document.getElementById("mic");

const name =
document.getElementById("name");


/* =====================================================
   DEVELOPMENT ELEMENTS
===================================================== */

const devButton =
document.getElementById("devButton");

const devPanel =
document.getElementById("devPanel");

const devClose =
document.getElementById("devClose");

const devCancel =
document.getElementById("devCancel");

const devAnalyze =
document.getElementById("devAnalyze");

const devInput =
document.getElementById("devInput");

const devResult =
document.getElementById("devResult");

const devSpinner =
document.getElementById("devSpinner");


/* =====================================================
   MAIN STATE
===================================================== */

let W=0,
H=0,
DPR=1,
cx=0,
cy=0,
R=0,
pts=[];

let level=0;
let target=0;
let mode="idle";

let audioCtx=null;
let analyser=null;
let audioData=null;
let stream=null;

let recognition=null;
let recognizing=false;
let speaking=false;


/* =====================================================
   MEMORY
===================================================== */

const MEMORY_KEY=
"ayai_memory_v3";

let conversation=[];


function loadMemory(){

try{

conversation=
JSON.parse(
localStorage.getItem(MEMORY_KEY)||"[]"
);

if(!Array.isArray(conversation))
conversation=[];

}catch(e){

conversation=[];

}

}


function saveMemory(){

try{

conversation=
conversation.slice(-20);

localStorage.setItem(
MEMORY_KEY,
JSON.stringify(conversation)
);

}catch(e){}

}


function clearMemory(){

conversation=[];

try{

localStorage.removeItem(
MEMORY_KEY
);

}catch(e){}

heard.textContent=
"تم مسح ذاكرة AyAI.";

setMode(
"idle",
"MEMORY CLEARED"
);

setTimeout(()=>{

heard.textContent="";

setMode(
"idle",
"AYAI IS READY"
);

},1800);

}


let pressTimer=null;


name.addEventListener(
"touchstart",
()=>{

pressTimer=
setTimeout(
clearMemory,
1500
);

},
{passive:true}
);


name.addEventListener(
"touchend",
()=>{

if(pressTimer)
clearTimeout(pressTimer);

pressTimer=null;

},
{passive:true}
);


/* =====================================================
   ORB
===================================================== */

function resize(){

DPR=
Math.min(
devicePixelRatio||1,
2
);

W=innerWidth;
H=innerHeight;

canvas.width=
Math.max(
1,
Math.floor(W*DPR)
);

canvas.height=
Math.max(
1,
Math.floor(H*DPR)
);

ctx.setTransform(
DPR,
0,
0,
DPR,
0,
0
);

cx=W/2;
cy=H/2;

R=
Math.min(W,H)*.235;

makePts();

}


function makePts(){

pts=[];

const n=
Math.max(
120,
Math.floor(
Math.min(W,H)*.38
)
);

for(
let i=0;
i<n;
i++
){

pts.push({

a:
Math.random()*Math.PI*2,

r:
R*
(.78+
Math.random()*.29),

s:
(Math.random()-.5)*.001,

ph:
Math.random()*Math.PI*2,

op:
.2+
Math.random()*.7,

z:
Math.random()

});

}

}


function setMode(m,text){

mode=m;

status.textContent=text;

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(t){

ctx.clearRect(
0,
0,
W,
H
);

const time=
t*.001;

let measured=0;


if(
analyser &&
audioData
){

analyser.getByteTimeDomainData(
audioData
);

let sum=0;

for(
let i=0;
i<audioData.length;
i++
){

const v=
(audioData[i]-128)/128;

sum+=v*v;

}

measured=
Math.min(
1,
Math.sqrt(
sum/audioData.length
)*4.5
);

}


target=
Math.max(

measured,

mode==="listening"
? .035

:
mode==="speaking"
? .06

:
mode==="thinking"
? .025

:
mode==="developing"
? .035

:
.012

);


level+=
(target-level)*.1;


const glow=
ctx.createRadialGradient(
cx,
cy,
R*.1,
cx,
cy,
R*1.55
);


glow.addColorStop(
0,
`rgba(60,170,255,${.025+level*.09})`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);


ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*1.55,
0,
Math.PI*2
);

ctx.fill();


for(
let k=0;
k<3;
k++
){

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1+k*.035)
+
Math.sin(
time*1.5+k
)*2
+
level*12,
0,
Math.PI*2
);

ctx.strokeStyle=
`rgba(120,210,255,${.045+level*.025})`;

ctx.lineWidth=.6;

ctx.stroke();

}


for(
let i=0;
i<pts.length;
i++
){

const p=pts[i];

p.a+=
p.s*
(1+level*10);

const rr=
p.r+
Math.sin(
time*(.8+p.z*.9)+p.ph
)*
(3+level*28);

const x=
cx+
Math.cos(p.a)*rr;

const y=
cy+
Math.sin(p.a)*rr;


for(
let j=i+1;
j<Math.min(i+7,pts.length);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(
time*(.8+q.z*.9)+q.ph
)*
(3+level*28);

const qx=
cx+
Math.cos(q.a)*qrr;

const qy=
cy+
Math.sin(q.a)*qrr;

const d=
Math.hypot(
x-qx,
y-qy
);


if(d<72){

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
qx,
qy
);

ctx.strokeStyle=
`rgba(150,225,255,${Math.max(
0,
(.17-d/520)*
(.7+level*2.3)
)})`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


ctx.beginPath();

ctx.arc(
x,
y,
p.op*.8+
level*1.8,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(210,242,255,${Math.min(
1,
p.op*(.45+level*1.5)
)})`;

ctx.shadowBlur=
7+level*15;

ctx.shadowColor=
"#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


for(
let k=0;
k<4;
k++
){

const a=
time*(.18+k*.035)
*
(k%2?1:-1)
+
k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(190,238,255,${.22+level*.55})`;

ctx.lineWidth=
1.1+level*2;

ctx.stroke();

}


requestAnimationFrame(
animate
);

}


/* =====================================================
   AUDIO
===================================================== */

async function setupAudio(){

if(audioCtx){

if(
audioCtx.state==="suspended"
)
await audioCtx.resume();

return;

}


if(
!navigator.mediaDevices?.getUserMedia
)
throw new Error(
"Microphone unavailable"
);


stream=
await navigator.mediaDevices
.getUserMedia({
audio:true
});


const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)
return;


audioCtx=
new AC();


const src=
audioCtx
.createMediaStreamSource(
stream
);


analyser=
audioCtx
.createAnalyser();


analyser.fftSize=
1024;


audioData=
new Uint8Array(
analyser.fftSize
);


src.connect(
analyser
);

}


/* =====================================================
   VOICE
===================================================== */

function getArabicVoice(){

if(
!("speechSynthesis"in window)
)
return null;


const voices=
speechSynthesis
.getVoices()||[];


return voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-iq"
)
||
voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-sa"
)
||
voices.find(
v=>
(v.lang||"")
.toLowerCase()
.startsWith("ar")
)
||
null;

}


function speak(text){

if(
!("speechSynthesis"in window)
){

setMode(
"idle",
"VOICE NOT AVAILABLE"
);

return;

}


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(
text
);

const voice=
getArabicVoice();


if(voice){

u.voice=voice;
u.lang=voice.lang;

}else{

u.lang="ar-SA";

}


u.rate=.9;
u.pitch=.95;
u.volume=1;

speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);


u.onstart=()=>{

speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


u.onend=()=>{

speaking=false;

if(!recognizing)
setMode(
"idle",
"AYAI IS READY"
);

};


u.onerror=()=>{

speaking=false;

if(!recognizing)
setMode(
"idle",
"AYAI IS READY"
);

};


speechSynthesis.speak(u);


}catch(e){

speaking=false;

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =====================================================
   QUICK COMMANDS
===================================================== */

function normalizeArabic(s){

return s
.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ة/g,"ه")
.replace(/[؟?!.،,]/g," ")
.replace(/\s+/g," ")
.trim();

}


function quickCommand(text){

const t=
normalizeArabic(text);


if(
/(شكد|كم|شنو الوقت|الوقت|الساعه|الساعة)/
.test(t)
){

const now=
new Date();

return `الساعة الآن ${
now.toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


if(
/(تاريخ اليوم|شنو التاريخ|التاريخ|اليوم شنو)/
.test(t)
){

const now=
new Date();

return `اليوم ${
now.toLocaleDateString(
"ar-IQ",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
)
}.`;

}


if(
/^(افتح|شغل|روح ل)(\s+)?(يوتيوب|youtube)/
.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";

}


if(
/^(افتح|روح ل)(\s+)?(جوجل|گوگل|google)/
.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


let m=
t.match(
/(?:ابحث|دور|ابحثلي|دورلي)(?: عن)?\s+(.+)/
);


if(m){

const q=
m[1].trim();

if(q){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);

return `بحثتلك عن ${q}.`;

}

}


m=
t.match(
/(?:احسب|حساب)\s+(.+)/
);


if(m){

let expr=
m[1]
.replace(/ضرب|في/g,"*")
.replace(/قسمة على|قسمه على|على/g,"/")
.replace(/زائد/g,"+")
.replace(/ناقص/g,"-")
.replace(/×/g,"*")
.replace(/÷/g,"/");


if(
/^[0-9+\-*/().\s]+$/
.test(expr)
){

try{

const result=
Function(
'"use strict";return ('+
expr+
')'
)();


if(
Number.isFinite(result)
)
return `النتيجة هي ${result}.`;

}catch(e){}

}

}


if(
/(طور نفسك|طور كودك|طور النظام|تطور نفسك|development|develop|طور اي اي|طور ayai)/
.test(t)
){

openDevelopmentCore(
"المستخدم طلب من AyAI تطوير نفسه."
);

return "__DEV__";

}


if(
/(مسح الذاكره|امسح الذاكره|انس كلشي|انسى كلشي)/
.test(t)
){

clearMemory();

return "__NO_SPEAK__";

}


return null;

}


/* =====================================================
   AI CHAT
===================================================== */

async function reply(text){

const t=
text.trim();

if(!t)
return;


const quick=
quickCommand(t);


if(quick){

if(
quick==="__DEV__"
){

return;

}


if(
quick!=="__NO_SPEAK__"
){

heard.textContent=
quick;

speak(quick);

}

return;

}


conversation.push({
role:"user",
content:t
});

saveMemory();


heard.textContent=
"جاري التفكير...";

setMode(
"thinking",
"AYAI IS THINKING"
);


try{

const memoryText=
conversation
.slice(-12)
.map(
m=>
(
m.role==="user"
?
"المستخدم: "
:
"AyAI: "
)+
m.content
)
.join("\n");


const prompt=
`أنت AyAI، مساعد شخصي ذكي وودود.

تحدث بالعربية، ويمكنك استخدام اللهجة العراقية بشكل طبيعي.

كن مختصراً في الأسئلة البسيطة وواضحاً في الأسئلة المعقدة.

هذه ذاكرة المحادثة:

${memoryText}

السؤال الحالي:

${t}

أجب مباشرة عن السؤال الحالي.`;


const response=
await fetch(
"/api/chat",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
message:prompt
})

}
);


const data=
await response.json();


if(!response.ok)
throw new Error(
data.error||
"API Error"
);


const answer=
(data.answer||
"ما حصلت جواب.")
.trim();


conversation.push({
role:"assistant",
content:answer
});

saveMemory();


heard.textContent=
answer;

speak(answer);


}catch(error){

console.error(error);


if(
conversation.length&&
conversation[
conversation.length-1
].role==="user"
){

conversation.pop();

saveMemory();

}


const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";


heard.textContent=
msg;

speak(msg);

}

}

/*
-----------------------------------------
HTML SAFE
-----------------------------------------
*/

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
-----------------------------------------
Extract JSON
-----------------------------------------
*/

function extractJSON(text){

if(!text)
return null;


try{

return JSON.parse(text);

}catch(e){}


const start=
text.indexOf("{");

const end=
text.lastIndexOf("}");


if(
start!==-1 &&
end!==-1 &&
end>start
){

try{

return JSON.parse(
text.slice(
start,
end+1
)
);

}catch(e){}

}


return null;

}

/* =====================================================
   VOICE RECOGNITION
===================================================== */

function startRecognition(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;


if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

heard.textContent=
"المتصفح الحالي لا يدعم التعرف على الصوت.";

return;

}


if(recognition){

try{

recognition.abort();

}catch(e){}

}


recognition=
new SR();


recognition.lang=
"ar-IQ";

recognition.continuous=
false;

recognition.interimResults=
true;

recognition.maxAlternatives=
1;


recognition.onstart=()=>{

recognizing=true;

mic.classList.add("on");

setMode(
"listening",
"LISTENING..."
);

heard.textContent="";

};


recognition.onresult=e=>{

let finalText="";
let interim="";


for(
let i=e.resultIndex;
i<e.results.length;
i++
){

const tx=
e.results[i][0]
.transcript;


e.results[i].isFinal
?
finalText+=tx
:
interim+=tx;

}


heard.textContent=
finalText||
interim;


if(finalText)
reply(finalText);

};


recognition.onerror=e=>{

recognizing=false;

mic.classList.remove(
"on"
);


if(
e.error==="not-allowed"||
e.error==="service-not-allowed"
){

setMode(
"idle",
"MICROPHONE DENIED"
);

heard.textContent=
"اسمح للمتصفح باستخدام الميكروفون.";

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


recognition.onend=()=>{

recognizing=false;

mic.classList.remove(
"on"
);

if(!speaking)
setMode(
"idle",
"AYAI IS READY"
);

};


try{

recognition.start();

}catch(e){

recognizing=false;

mic.classList.remove(
"on"
);

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =====================================================
   UNLOCK SPEECH
===================================================== */

function unlockSpeech(){

if(
!("speechSynthesis"in window)
)
return;


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(
" "
);

u.volume=0;

u.rate=10;


speechSynthesis.speak(u);


setTimeout(
()=>{

try{

speechSynthesis.cancel();

}catch(e){}

},
100
);


}catch(e){}

}
