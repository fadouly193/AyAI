<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>AyAI — Advanced Voice Assistant</title>

<style>

*{
box-sizing:border-box;
}

html,body{

margin:0;
width:100%;
height:100%;

overflow:hidden;

background:#000;

color:#eef9ff;

font-family:
Inter,
"Segoe UI",
Arial,
sans-serif;

}

body{
min-height:100dvh;
}

#app{

width:100%;
height:100%;
min-height:100dvh;

position:relative;

background:#000;

overflow:hidden;

}

canvas{

position:absolute;
inset:0;

width:100%;
height:100%;

display:block;

}


/* =========================
STATUS
========================= */

#status{

position:absolute;

top:8%;
left:50%;

transform:translateX(-50%);

direction:ltr;

font-size:17px;

letter-spacing:3px;

font-weight:300;

white-space:nowrap;

text-shadow:0 0 18px #78cfff;

transition:.25s;

z-index:5;

}

#status:before,
#status:after{

content:"";

display:inline-block;

width:65px;

height:1px;

vertical-align:middle;

margin:0 17px;

background:
linear-gradient(
90deg,
transparent,
#72caff
);

}

#status:after{

background:
linear-gradient(
90deg,
#72caff,
transparent
);

}


/* =========================
MEMORY
========================= */

#memoryStatus{

position:absolute;

top:14%;

right:4%;

font-size:11px;

letter-spacing:1.5px;

color:#355765;

direction:ltr;

z-index:5;

}


/* =========================
NAME
========================= */

#name{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

font-size:
clamp(45px,7vw,88px);

font-weight:200;

letter-spacing:9px;

direction:ltr;

text-shadow:
0 0 25px rgba(130,210,255,.65);

pointer-events:none;

z-index:4;

transition:

top .8s ease,
transform .8s ease,
font-size .8s ease,
text-shadow .4s ease;

}

#app.active #name{

top:33%;

font-size:
clamp(32px,5vw,62px);

text-shadow:
0 0 35px rgba(130,210,255,.9);

}


/* =========================
ANSWER BOX
========================= */

#answerBox{

position:absolute;

left:50%;

top:60%;

transform:translateX(-50%);

width:min(720px,86vw);

max-height:23vh;

overflow-y:auto;

padding:14px 18px;

border:
1px solid rgba(130,215,255,.18);

border-radius:16px;

background:
rgba(3,10,15,.72);

box-shadow:

0 0 30px
rgba(70,190,255,.08),

inset 0 0 25px
rgba(80,190,255,.035);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

opacity:0;

visibility:hidden;

transition:

opacity .35s ease,
transform .35s ease,
top .5s ease;

z-index:6;

}

#answerBox.show{

opacity:1;
visibility:visible;

}

#answerText{

color:
rgba(225,245,255,.9);

font-size:15px;

line-height:1.9;

text-align:center;

direction:rtl;

white-space:pre-wrap;

word-break:break-word;

}


/* =========================
HEARD
========================= */

#heard{

position:absolute;

left:50%;

top:65%;

transform:translateX(-50%);

width:min(700px,80vw);

text-align:center;

color:
rgba(220,242,252,.72);

font-size:15px;

line-height:1.7;

min-height:28px;

direction:rtl;

z-index:2;

}

#heard:empty{
opacity:0;
}


/* =========================
MIC
========================= */

#mic{

position:absolute;

left:50%;

bottom:6%;

transform:translateX(-50%);

width:58px;
height:58px;

border-radius:50%;

border:
1px solid rgba(145,220,255,.35);

background:#030a0f;

color:#d9f5ff;

display:grid;

place-items:center;

cursor:pointer;

box-shadow:
0 0 24px rgba(80,190,255,.12);

transition:.25s;

z-index:10;

-webkit-tap-highlight-color:transparent;

}

#mic:hover,
#mic.on{

border-color:#bdeaff;

box-shadow:

0 0 34px rgba(80,200,255,.45),

inset 0 0 18px rgba(80,180,255,.12);

}

#mic.on{

animation:
micPulse 1.4s infinite;

}

@keyframes micPulse{

0%{
box-shadow:
0 0 18px rgba(80,200,255,.25);
}

50%{
box-shadow:
0 0 42px rgba(80,200,255,.65);
}

100%{
box-shadow:
0 0 18px rgba(80,200,255,.25);
}

}

#mic svg{

width:23px;
height:23px;

fill:none;

stroke:currentColor;

stroke-width:1.5;

}


/* =========================
VOICE BUTTON
========================= */

#voiceToggle{

position:absolute;

bottom:6%;

right:5%;

width:42px;
height:42px;

border-radius:50%;

border:
1px solid rgba(145,220,255,.25);

background:#030a0f;

color:#6f9bab;

display:grid;

place-items:center;

cursor:pointer;

z-index:10;

transition:.25s;

}

#voiceToggle.active{

color:#d9f5ff;

border-color:#8ddcff;

box-shadow:
0 0 20px rgba(80,200,255,.3);

}

#voiceToggle svg{

width:19px;
height:19px;

fill:none;

stroke:currentColor;

stroke-width:1.5;

}


/* =========================
DEVELOPMENT BUTTON
========================= */

#devButton{

position:absolute;

bottom:6%;

left:5%;

width:42px;
height:42px;

border-radius:50%;

border:
1px solid rgba(145,220,255,.25);

background:#030a0f;

color:#66828e;

display:grid;

place-items:center;

cursor:pointer;

z-index:10;

transition:.25s;

}

#devButton:hover{

color:#d9f5ff;

border-color:#8ddcff;

box-shadow:
0 0 20px rgba(80,200,255,.3);

}

#devButton svg{

width:19px;
height:19px;

fill:none;

stroke:currentColor;

stroke-width:1.4;

}


/* =========================
DEVELOPMENT PANEL
========================= */

#developmentPanel{

position:absolute;

inset:0;

background:
rgba(0,3,6,.78);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

z-index:30;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

opacity:0;

visibility:hidden;

transition:.3s;

}

#developmentPanel.open{

opacity:1;
visibility:visible;

}

#devCard{

width:min(720px,94vw);

max-height:88vh;

overflow-y:auto;

background:
linear-gradient(
145deg,
rgba(8,18,25,.96),
rgba(2,7,11,.96)
);

border:
1px solid rgba(120,210,255,.22);

border-radius:22px;

padding:24px;

box-shadow:
0 0 60px rgba(60,180,255,.12);

direction:rtl;

}

#devHeader{

display:flex;

align-items:center;

justify-content:space-between;

direction:ltr;

margin-bottom:20px;

}

#devTitle{

font-size:22px;

letter-spacing:2px;

color:#dff7ff;

direction:ltr;

}

#closeDev{

width:36px;
height:36px;

border-radius:50%;

border:
1px solid rgba(130,210,255,.2);

background:#030a0f;

color:#8caab6;

cursor:pointer;

font-size:18px;

}

.devLabel{

font-size:11px;

letter-spacing:2px;

color:#547582;

direction:ltr;

margin-bottom:7px;

}

#devInput{

width:100%;

min-height:90px;

resize:vertical;

background:#02070a;

border:
1px solid rgba(130,210,255,.15);

border-radius:12px;

padding:13px;

color:#dff7ff;

font-family:inherit;

font-size:14px;

outline:none;

direction:rtl;

}

#devInput:focus{

border-color:
rgba(130,220,255,.45);

}

#analyzeDev{

margin-top:12px;

width:100%;

padding:13px;

border:1px solid rgba(120,210,255,.25);

border-radius:12px;

background:#06131a;

color:#dff7ff;

cursor:pointer;

font-size:14px;

}

#analyzeDev:hover{

background:#0a202b;

box-shadow:
0 0 22px rgba(80,190,255,.15);

}

#devResult{

margin-top:18px;

display:none;

}

#devResult.show{

display:block;

}

#proposal{

background:
rgba(1,8,12,.8);

border:
1px solid rgba(120,210,255,.14);

border-radius:14px;

padding:16px;

direction:rtl;

line-height:1.9;

color:#d4edf5;

white-space:pre-wrap;

}

#devActions{

display:flex;

gap:10px;

margin-top:12px;

}

#approveDev,
#rejectDev{

flex:1;

padding:13px;

border-radius:11px;

cursor:pointer;

font-family:inherit;

}

#approveDev{

background:
rgba(30,130,170,.22);

border:
1px solid rgba(110,220,255,.4);

color:#dff9ff;

}

#rejectDev{

background:
rgba(80,20,25,.2);

border:
1px solid rgba(255,120,120,.2);

color:#dca8a8;

}

#devLog{

margin-top:16px;

font-size:11px;

color:#52717e;

line-height:1.8;

direction:ltr;

text-align:left;

}


/* =========================
TIP
========================= */

#tip{

position:absolute;

bottom:2%;

left:50%;

transform:translateX(-50%);

font-size:10px;

letter-spacing:1.7px;

color:#53707e;

direction:ltr;

white-space:nowrap;

z-index:2;

}


/* =========================
MOBILE
========================= */

@media(max-width:600px){

#status{

font-size:12px;
letter-spacing:2px;
top:7%;

}

#status:before,
#status:after{

width:28px;
margin:0 8px;

}

#memoryStatus{

top:13%;
right:4%;
font-size:9px;

}

#name{

font-size:52px;
letter-spacing:7px;

}

#app.active #name{

top:30%;
font-size:42px;

}

#answerBox{

top:51%;

width:88vw;

max-height:28vh;

padding:12px 15px;

}

#answerText{

font-size:14px;

}

#heard{

top:61%;

width:86vw;

font-size:14px;

}

#voiceToggle{

right:5%;

bottom:6.2%;

width:38px;
height:38px;

}

#devButton{

left:5%;

bottom:6.2%;

width:38px;
height:38px;

}

#tip{

font-size:8px;

letter-spacing:1.1px;

}

#devCard{

padding:18px;

}

}


/* =========================
SMALL HEIGHT
========================= */

@media(max-height:700px){

#status{
top:5%;
}

#name{
top:43%;
}

#app.active #name{
top:27%;
}

#answerBox{
top:47%;
max-height:27vh;
}

#mic{
bottom:7%;
}

}

</style>

<body>

<div id="app">

<canvas id="orb"></canvas>


<div id="status">

AyAI
</div>

<div id="answerText"></div>
</div>


<!-- VOICE -->

<button
id="voiceToggle"
type="button"
aria-label="Toggle voice"

>

<svg viewBox="0 0 24 24">

<button
id="devButton"
type="button"
aria-label="Self Development"

>

<svg viewBox="0 0 24 24">

<path d="M12 3a3 3 0 0 0-3 3v1.2a7 7 0 1 0 6 0V6a3 3 0 0 0-3-3Z"/>

<path d="M9 18v3h6v-3"/>

<path d="M12 10v4"/>

id="mic"

>

x="9"
y="3"
width="6"
height="11"
rx="3"
/>

/>

<path
d="M12 17v4M9 21h6"
/>

</div>

<script>

(function(){

"use strict";


/* =========================
ELEMENTS
========================= */

const canvas=
document.getElementById("orb");

const ctx=
canvas.getContext("2d");

const status=
document.getElementById("status");

const heard=
document.getElementById("heard");

const name=
document.getElementById("name");

const mic=
document.getElementById("mic");

const app=
document.getElementById("app");

const answerBox=
document.getElementById("answerBox");

const answerText=
document.getElementById("answerText");

const voiceToggle=
document.getElementById("voiceToggle");

const memoryStatus=
document.getElementById("memoryStatus");

const devButton=
document.getElementById("devButton");

const developmentPanel=
document.getElementById("developmentPanel");

const closeDev=
document.getElementById("closeDev");

const devInput=
document.getElementById("devInput");

const analyzeDev=
document.getElementById("analyzeDev");

const devResult=
document.getElementById("devResult");

const proposal=
document.getElementById("proposal");

const approveDev=
document.getElementById("approveDev");

const rejectDev=
document.getElementById("rejectDev");

const devLog=
document.getElementById("devLog");


/* =========================
VARIABLES
========================= */

let W=0;
let H=0;
let DPR=1;

let cx=0;
let cy=0;
let R=0;

let pts=[];

let level=0;
let target=0;

let mode="idle";


/* =========================
AUDIO
========================= */

let audioCtx=null;
let analyser=null;
let audioData=null;
let stream=null;


/* =========================
RECOGNITION
========================= */

let recognition=null;
let recognizing=false;
let speaking=false;

let handsFree=false;
let waitingForReply=false;

let restartTimer=null;


/* =========================
VOICE
========================= */

let voiceEnabled=true;


/* =========================
MEMORY
========================= */

let conversation=[];

const MEMORY_KEY=
"ayai_conversation_memory_v2";


/* =========================
DEVELOPMENT
========================= */

let currentProposal=null;

let developmentBusy=false;


/* =========================
MEMORY LOAD
========================= */

function loadMemory(){

try{

const saved=
localStorage.getItem(
MEMORY_KEY
);

if(saved){

const parsed=
JSON.parse(saved);

if(Array.isArray(parsed)){

conversation=
parsed.slice(-30);

}

}

memoryStatus.textContent=
"MEMORY: ON";

}catch(e){

conversation=[];

memoryStatus.textContent=
"MEMORY: OFF";

}

}


/* =========================
MEMORY SAVE
========================= */

function saveMemory(){

try{

localStorage.setItem(
MEMORY_KEY,
JSON.stringify(
conversation.slice(-30)
)
);

}catch(e){}

}


/* =========================
CLEAR MEMORY
========================= */

function clearMemory(){

conversation=[];

try{

localStorage.removeItem(
MEMORY_KEY
);

}catch(e){}

showAnswer(
"تم مسح ذاكرة المحادثة."
);

if(voiceEnabled){

speak(
"تم مسح ذاكرة المحادثة."
);

}

}


/* =========================
SCREEN
========================= */

function resize(){

DPR=
Math.min(
window.devicePixelRatio||1,
2
);

W=
window.innerWidth;

H=
window.innerHeight;


canvas.width=
Math.max(
1,
Math.floor(W*DPR)
);

canvas.height=
Math.max(
1,
Math.floor(H*DPR)
);


ctx.setTransform(
DPR,0,0,DPR,0,0
);


cx=W/2;

cy=H/2;

R=
Math.min(W,H)*.235;


makePts();

}


/* =========================
PARTICLES
========================= */

function makePts(){

pts=[];

const n=
Math.max(
120,
Math.floor(
Math.min(W,H)*.38
)
);

for(
let i=0;
i<n;
i++
){

pts.push({

a:
Math.random()*
Math.PI*2,

r:
R*
(.78+
Math.random()*.29),

s:
(Math.random()-.5)*.001,

ph:
Math.random()*
Math.PI*2,

op:
.2+
Math.random()*.7,

z:
Math.random()

});

}

}


/* =========================
MODE
========================= */

function setMode(m,text){

mode=m;

status.textContent=text;

}


/* =========================
ANSWER
========================= */

function showAnswer(text){

answerText.textContent=
text||"";

answerBox.classList.add("show");

}


/* =========================
ORB
========================= */

function animate(t){

ctx.clearRect(
0,
0,
W,
H
);

const time=
t*.001;

let measured=0;


if(analyser&&audioData){

analyser.getByteTimeDomainData(
audioData
);

let sum=0;

for(
let i=0;
i<audioData.length;
i++
){

const v=
(audioData[i]-128)/128;

sum+=v*v;

}

measured=
Math.min(
1,
Math.sqrt(
sum/audioData.length
)*4.5
);

}


target=
Math.max(

measured,

mode==="listening"
? .035

:

mode==="speaking"
? .06

:

mode==="thinking"
? .025

:

.012

);


level+=
(target-level)*.1;


/* glow */

const glow=
ctx.createRadialGradient(
cx,cy,R*.1,
cx,cy,R*1.55
);

glow.addColorStop(
0,
`rgba(
60,170,255,
${.025+level*.09}
)`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,cy,R*1.55,
0,Math.PI*2
);

ctx.fill();


/* rings */

for(
let k=0;
k<3;
k++
){

ctx.beginPath();

ctx.arc(

cx,
cy,

R*(1+k*.035)
+
Math.sin(time*1.5+k)*2
+
level*12,

0,
Math.PI*2

);

ctx.strokeStyle=
`rgba(
120,
210,
255,
${.045+level*.025}
)`;

ctx.lineWidth=.6;

ctx.stroke();

}


/* particles */

for(
let i=0;
i<pts.length;
i++
){

const p=pts[i];

p.a+=
p.s*
(1+level*10);

const rr=
p.r+
Math.sin(
time*(.8+p.z*.9)+p.ph
)*
(3+level*28);

const x=
cx+
Math.cos(p.a)*rr;

const y=
cy+
Math.sin(p.a)*rr;


for(
let j=i+1;
j<Math.min(i+7,pts.length);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(
time*(.8+q.z*.9)+q.ph
)*
(3+level*28);

const qx=
cx+
Math.cos(q.a)*qrr;

const qy=
cy+
Math.sin(q.a)*qrr;

const d=
Math.hypot(
x-qx,
y-qy
);

if(d<72){

ctx.beginPath();

ctx.moveTo(x,y);

ctx.lineTo(qx,qy);

ctx.strokeStyle=
`rgba(
150,
225,
255,
${Math.max(
0,
(.17-d/520)*
(.7+level*2.3)
)}
)`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


ctx.beginPath();

ctx.arc(
x,y,
p.op*.8+level*1.8,
0,Math.PI*2
);

ctx.fillStyle=
`rgba(
210,
242,
255,
${Math.min(
1,
p.op*(.45+level*1.5)
)}
)`;

ctx.shadowBlur=
7+level*15;

ctx.shadowColor=
"#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


/* rotating arcs */

for(
let k=0;
k<4;
k++
){

const a=
time*
(.18+k*.035)*
(k%2?1:-1)
+k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(
190,
238,
255,
${.22+level*.55}
)`;

ctx.lineWidth=
1.1+level*2;

ctx.stroke();

}


requestAnimationFrame(animate);

}


/* =========================
AUDIO SETUP
========================= */

async function setupAudio(){

if(audioCtx){

if(
audioCtx.state===
"suspended"
){

await audioCtx.resume();

}

return;

}


if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone unavailable"
);

}


stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});


const AC=
window.AudioContext||
window.webkitAudioContext;


if(!AC)return;


audioCtx=
new AC();


const src=
audioCtx.createMediaStreamSource(
stream
);


analyser=
audioCtx.createAnalyser();

analyser.fftSize=1024;

audioData=
new Uint8Array(
analyser.fftSize
);

src.connect(analyser);

}


/* =========================
ARABIC VOICE
========================= */

function getArabicVoice(){

if(
!("speechSynthesis" in window)
)return null;


const voices=
speechSynthesis.getVoices()||[];


return

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-iq"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-sa"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase().startsWith("ar")
)

||

null;

}


/* =========================
SPEAK
========================= */

function speak(text){

if(!voiceEnabled){

resumeConversation();

return;

}


if(
!("speechSynthesis" in window)
){

resumeConversation();

return;

}


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(text);


const voice=
getArabicVoice();


if(voice){

u.voice=voice;

u.lang=voice.lang;

}else{

u.lang="ar-SA";

}


u.rate=.9;

u.pitch=.95;

u.volume=1;


speaking=true;

app.classList.add("active");


setMode(
"speaking",
"AYAI IS SPEAKING"
);


u.onstart=()=>{

speaking=true;

app.classList.add("active");

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


u.onend=()=>{

speaking=false;

app.classList.remove("active");


if(handsFree){

waitingForReply=false;

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


u.onerror=()=>{

speaking=false;

app.classList.remove("active");


if(handsFree){

waitingForReply=false;

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


speechSynthesis.speak(u);


}catch(e){

speaking=false;

app.classList.remove("active");

resumeConversation();

}

}


/* =========================
NORMALIZE
========================= */

function normalizeArabic(s){

return s
.toLowerCase()

.replace(/[أإآ]/g,"ا")

.replace(/ة/g,"ه")

.replace(/[؟?!.،,]/g," ")

.replace(/\s+/g," ")

.trim();

}


/* =========================
QUICK COMMANDS
========================= */

function quickCommand(text){

const t=
normalizeArabic(text);


/* time */

if(
/(شكد|كم|شنو الوقت|الوقت|الساعه|الساعة)/
.test(t)
){

return `الساعة الآن ${
new Date().toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


/* date */

if(
/(تاريخ اليوم|شنو التاريخ|التاريخ|اليوم شنو)/
.test(t)
){

return `اليوم ${
new Date().toLocaleDateString(
"ar-IQ",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
)
}.`;

}


/* youtube */

if(
/^(افتح|شغل|روح ل)\s*(يوتيوب|youtube)/
.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";

}


/* google */

if(
/^(افتح|روح ل)\s*(جوجل|گوگل|google)/
.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


/* search */

let m=
t.match(
/(?:ابحث|دور|ابحثلي|دورلي)(?: عن)?\s+(.+)/
);

if(m){

const q=m[1].trim();

if(q){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);

return `بحثتلك عن ${q}.`;

}

}


/* calculator */

m=
t.match(
/(?:احسب|حساب)\s+(.+)/
);

if(m){

let expr=
m[1]

.replace(/ضرب|في/g,"*")

.replace(
/قسمة على|قسمه على|على/g,
"/"
)

.replace(/زائد/g,"+")

.replace(/ناقص/g,"-")

.replace(/×/g,"*")

.replace(/÷/g,"/");


if(
/^[0-9+\-*/().\s]+$/.test(expr)
){

try{

const result=
Function(
'"use strict";return ('+
expr+
')'
)();

if(Number.isFinite(result)){

return `النتيجة هي ${result}.`;

}

}catch(e){}

}

}


/* clear memory */

if(
/(مسح الذاكره|امسح الذاكره|انس كلشي|انسى كلشي)/
.test(t)
){

clearMemory();

return "__NO_SPEAK__";

}


return null;

}


/* =========================
AI CHAT
========================= */

async function reply(text){

const t=
text.trim();

if(!t)return;


/* quick */

const quick=
quickCommand(t);


if(quick){

if(
quick!=="__NO_SPEAK__"
){

showAnswer(quick);

heard.textContent="";

if(voiceEnabled){

speak(quick);

}else{

resumeConversation();

}

}

return;

}


/* memory */

conversation.push({

role:"user",
content:t

});

saveMemory();


showAnswer("");

heard.textContent=
"جاري التفكير...";

app.classList.add("active");

setMode(
"thinking",
"AYAI IS THINKING"
);


const memoryText=

conversation
.slice(-12)
.map(
m=>
(
m.role==="user"
?
"المستخدم: "
:
"AyAI: "
)+
m.content
)
.join("\n");


const prompt=

`أنت AyAI، مساعد شخصي ذكي.

تحدث بالعربية، ويمكنك استخدام اللهجة العراقية بشكل طبيعي.

كن واضحاً ومختصراً.

ذاكرة المحادثة:

${memoryText}

السؤال الحالي:

${t}

أجب مباشرة عن السؤال الحالي.`;


try{

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
message:prompt
})

});


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error||
"API Error"
);

}


const answer=
(
data.answer||
"ما حصلت جواب."
).trim();


conversation.push({

role:"assistant",
content:answer

});

saveMemory();


showAnswer(answer);

heard.textContent="";


if(voiceEnabled){

speak(answer);

}else{

resumeConversation();

}


}catch(error){

console.error(error);


if(
conversation.length &&
conversation[
conversation.length-1
].role==="user"
){

conversation.pop();

saveMemory();

}


const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";


showAnswer(msg);

heard.textContent="";


if(voiceEnabled){

speak(msg);

}else{

resumeConversation();

}

}

}


/* =========================
SPEECH RECOGNITION
========================= */

function startRecognition(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;


if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

handsFree=false;

return;

}


if(!handsFree)return;

if(recognizing)return;


if(recognition){

try{
recognition.abort();
}catch(e){}

}


recognition=
new SR();


recognition.lang="ar-IQ";

recognition.continuous=false;

recognition.interimResults=true;

recognition.maxAlternatives=1;


recognition.onstart=()=>{

recognizing=true;

waitingForReply=false;

mic.classList.add("on");

app.classList.add("active");

setMode(
"listening",
"LISTENING..."
);

heard.textContent="";

};


recognition.onresult=e=>{

let finalText="";

let interim="";


for(
let i=e.resultIndex;
i<e.results.length;
i++
){

const tx=
e.results[i][0].transcript;


if(e.results[i].isFinal){

finalText+=tx;

}else{

interim+=tx;

}

}


heard.textContent=
finalText||interim;


if(finalText){

waitingForReply=true;


try{
recognition.stop();
}catch(e){}


reply(finalText);

}

};


recognition.onerror=e=>{

recognizing=false;

mic.classList.remove("on");


if(
e.error==="not-allowed"||
e.error==="service-not-allowed"
){

handsFree=false;

setMode(
"idle",
"MICROPHONE DENIED"
);

heard.textContent=
"اسمح للمتصفح باستخدام الميكروفون.";

return;

}


if(
handsFree &&
!speaking &&
!waitingForReply
){

scheduleRecognition();

}

};


recognition.onend=()=>{

recognizing=false;

mic.classList.remove("on");


if(
handsFree &&
!speaking &&
!waitingForReply
){

scheduleRecognition();

}

};


try{

recognition.start();

}catch(e){

recognizing=false;

mic.classList.remove("on");

if(handsFree){

scheduleRecognition();

}

}

}


/* =========================
AUTO RESTART
========================= */

function scheduleRecognition(){

if(!handsFree)return;

if(recognizing)return;

if(speaking)return;


if(restartTimer){

clearTimeout(
restartTimer
);

}


restartTimer=
setTimeout(()=>{

if(
handsFree &&
!recognizing &&
!speaking &&
!waitingForReply
){

startRecognition();

}

},600);

}


/* =========================
RESUME
========================= */

function resumeConversation(){

waitingForReply=false;


if(
handsFree &&
!speaking
){

setMode(
"listening",
"LISTENING..."
);

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =========================
MOBILE SPEECH UNLOCK
========================= */

function unlockSpeech(){

if(
!("speechSynthesis" in window)
)return;


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(" ");

u.volume=0;

u.rate=10;

speechSynthesis.speak(u);


setTimeout(()=>{

try{
speechSynthesis.cancel();
}catch(e){}

},100);

}catch(e){}

}


/* =========================
VOICE TOGGLE
========================= */

voiceToggle.addEventListener(
"click",
()=>{

voiceEnabled=
!voiceEnabled;


voiceToggle.classList.toggle(
"active",
voiceEnabled
);


if(!voiceEnabled){

if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}

speaking=false;

}else{

unlockSpeech();

}

}
);


/* =========================
MIC BUTTON
========================= */

mic.addEventListener(
"click",
async()=>{

try{

if(handsFree){

handsFree=false;

waitingForReply=false;


if(restartTimer){

clearTimeout(
restartTimer
);

restartTimer=null;

}


if(recognition){

try{
recognition.abort();
}catch(e){}

}


if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}


speaking=false;

recognizing=false;

mic.classList.remove("on");

app.classList.remove("active");

setMode(
"idle",
"AYAI IS READY"
);

heard.textContent=
"تم إيقاف الاستماع.";

return;

}


handsFree=true;

waitingForReply=false;

unlockSpeech();

await setupAudio();

startRecognition();


}catch(e){

console.error(e);

handsFree=false;

recognizing=false;

mic.classList.remove("on");

app.classList.remove("active");

setMode(
"idle",
"MICROPHONE ACCESS REQUIRED"
);

heard.textContent=
"فعّل صلاحية الميكروفون للمتابعة.";

}

});
