<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>AyAI — Voice Assistant</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#eef9ff;
font-family:
Inter,
"Segoe UI",
Arial,
sans-serif;
}

body{
min-height:100dvh;
}

#app{
position:relative;
width:100%;
height:100%;
min-height:100dvh;
overflow:hidden;
background:#000;
}


/* =====================================================
   CANVAS
===================================================== */

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
}


/* =====================================================
   STATUS
===================================================== */

#status{
position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
direction:ltr;

font-size:17px;
letter-spacing:3px;
font-weight:300;

white-space:nowrap;

text-shadow:
0 0 18px #78cfff;

transition:
all .35s ease;

z-index:10;
}

#status:before,
#status:after{

content:"";

display:inline-block;

width:65px;
height:1px;

vertical-align:middle;

margin:0 17px;

background:
linear-gradient(
90deg,
transparent,
#72caff
);
}

#status:after{

background:
linear-gradient(
90deg,
#72caff,
transparent
);
}


/* =====================================================
   MEMORY
===================================================== */

#memoryStatus{

position:absolute;

top:13.5%;
right:5%;

font-size:11px;

letter-spacing:1.5px;

color:#315363;

direction:ltr;

z-index:10;

transition:.3s;
}

#memoryStatus.on{
color:#72caff;
text-shadow:
0 0 12px rgba(80,190,255,.35);
}


/* =====================================================
   NAME / ORB CENTER
===================================================== */

#name{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

font-size:
clamp(45px,7vw,88px);

font-weight:200;

letter-spacing:9px;

direction:ltr;

text-shadow:
0 0 25px rgba(130,210,255,.65);

pointer-events:auto;

z-index:8;

transition:
top .65s cubic-bezier(.22,.8,.25,1),
transform .65s cubic-bezier(.22,.8,.25,1),
font-size .65s ease,
letter-spacing .65s ease;

user-select:none;

}


/* عندما يظهر الجواب */

#app.answer-active #name{

top:37%;

font-size:
clamp(34px,5vw,60px);

letter-spacing:7px;

}


/* =====================================================
   ANSWER BOX
===================================================== */

#answerBox{

position:absolute;

left:50%;

top:59%;

transform:
translate(-50%,20px);

width:min(720px,86vw);

max-height:24vh;

overflow:auto;

padding:
15px 20px;

border:

1px solid
rgba(120,210,255,.18);

border-radius:18px;

background:

linear-gradient(
180deg,
rgba(5,15,22,.78),
rgba(2,7,11,.68)
);

box-shadow:

0 0 35px
rgba(60,180,255,.08),

inset 0 0 25px
rgba(70,180,255,.025);

color:
rgba(225,245,255,.9);

font-size:15px;

line-height:1.8;

text-align:center;

direction:rtl;

opacity:0;

visibility:hidden;

transition:

opacity .45s ease,

transform .55s
cubic-bezier(.22,.8,.25,1);

z-index:7;

-webkit-overflow-scrolling:touch;
}


/* answer visible */

#app.answer-active #answerBox{

opacity:1;

visibility:visible;

transform:
translate(-50%,0);

}


/* =====================================================
   HEARD / USER TEXT
===================================================== */

#heard{

position:absolute;

left:50%;

top:65%;

transform:
translateX(-50%);

width:min(700px,80vw);

text-align:center;

color:
rgba(220,242,252,.72);

font-size:15px;

line-height:1.7;

min-height:28px;

direction:rtl;

z-index:6;

transition:
opacity .3s ease;
}


/* =====================================================
   VOICE TOGGLE
===================================================== */

#voiceToggle{

position:absolute;

top:13%;

left:5%;

width:42px;

height:42px;

border-radius:50%;

border:
1px solid
rgba(145,220,255,.28);

background:
rgba(3,10,15,.8);

color:#a8dff5;

display:grid;

place-items:center;

cursor:pointer;

z-index:12;

box-shadow:
0 0 20px
rgba(80,190,255,.08);

transition:.25s;
}

#voiceToggle.on{

border-color:#aeeaff;

color:#dff8ff;

box-shadow:

0 0 25px
rgba(80,200,255,.28),

inset 0 0 15px
rgba(80,180,255,.1);
}

#voiceToggle.off{

opacity:.55;
}

#voiceToggle svg{

width:20px;
height:20px;

fill:none;

stroke:currentColor;

stroke-width:1.5;

stroke-linecap:round;

stroke-linejoin:round;
}


/* =====================================================
   MICROPHONE
===================================================== */

#mic{

position:absolute;

left:50%;

bottom:6%;

transform:
translateX(-50%);

width:58px;

height:58px;

border-radius:50%;

border:
1px solid
rgba(145,220,255,.35);

background:#030a0f;

color:#d9f5ff;

display:grid;

place-items:center;

cursor:pointer;

box-shadow:
0 0 24px
rgba(80,190,255,.12);

transition:.3s;

z-index:12;
}

#mic:hover,
#mic.on{

border-color:#bdeaff;

box-shadow:

0 0 34px
rgba(80,200,255,.45),

inset 0 0 18px
rgba(80,180,255,.12);

transform:
translateX(-50%)
scale(1.05);
}

#mic svg{

width:23px;
height:23px;

fill:none;

stroke:currentColor;

stroke-width:1.5;

stroke-linecap:round;

stroke-linejoin:round;
}


/* =====================================================
   TIP
===================================================== */

#tip{

position:absolute;

bottom:2%;

left:50%;

transform:
translateX(-50%);

font-size:10px;

letter-spacing:1.7px;

color:#53707e;

direction:ltr;

white-space:nowrap;

z-index:10;

}


/* =====================================================
   THINKING
===================================================== */

#app.thinking #answerBox{

opacity:.5;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

#status{

font-size:12px;

letter-spacing:2px;

top:7%;
}

#status:before,
#status:after{

width:28px;

margin:0 8px;
}

#memoryStatus{

top:12.5%;

right:4%;

font-size:9px;
}

#voiceToggle{

top:11.5%;

left:4%;

width:38px;

height:38px;
}

#name{

font-size:52px;

letter-spacing:7px;
}

#app.answer-active #name{

top:34%;

font-size:38px;

letter-spacing:5px;
}

#heard{

top:64%;

width:86vw;

font-size:14px;
}

#answerBox{

top:51%;

width:88vw;

max-height:29vh;

font-size:14px;

line-height:1.75;

padding:13px 15px;

border-radius:16px;
}

#tip{

font-size:8px;

letter-spacing:1.1px;
}

}


/* =====================================================
   SMALL HEIGHT DEVICES
===================================================== */

@media(max-height:700px){

#status{
top:6%;
}

#name{
top:46%;
}

#answerBox{
top:53%;
max-height:25vh;
}

#mic{
bottom:7%;
}

}

</style>

</head>


<body>

<div id="app">


<!-- =================================================
     CANVAS
================================================= -->

<canvas id="orb"></canvas>


<!-- =================================================

================================================= -->

<div id="status">
AYAI IS READY
</div>


<!-- =================================================

================================================= -->

<div id="memoryStatus">
MEMORY: ON
</div>


<!-- =================================================

================================================= -->

<button
id="voiceToggle"
type="button"
aria-label="Voice On Off"
title="Voice On / Off"
>

<svg
viewBox="0 0 24 24"
>

<rect
x="9"
y="3"
width="6"
height="11"
rx="3"
></rect>

<path
d="M6.5 11.5a5.5 5.5 0 0 0 11 0"
></path>

<path
d="M12 17v4"
></path>

<path
d="M9 21h6"
></path>

</svg>

</button>


<!-- =================================================
     NAME
================================================= -->

<div id="name">
AyAI
</div>

     USER HEARD TEXT
================================================= -->

<div id="heard"></div>


<!-- =================================================
     ANSWER BOX
================================================= -->

<div id="answerBox"></div>


<!-- =================================================

================================================= -->

<button
id="mic"
type="button"
aria-label="Start AyAI"
>

<svg
viewBox="0 0 24 24"
>

<rect
x="9"
y="3"
width="6"
height="11"
rx="3"
></rect>

<path
d="M6.5 11.5a5.5 5.5 0 0 0 11 0"
></path>

<path

></path>

<path

></path>

</svg>

</button>

     TIP
================================================= -->

<div id="tip">
TAP TO SPEAK • TALK TO AYAI
</div>

<script>

(function(){

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const app =
document.getElementById("app");

const canvas =
document.getElementById("orb");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const heard =
document.getElementById("heard");

const answerBox =
document.getElementById("answerBox");

const mic =
document.getElementById("mic");

const name =
document.getElementById("name");

const voiceToggle =
document.getElementById("voiceToggle");

const memoryStatus =
document.getElementById("memoryStatus");


/* =====================================================
   VARIABLES
===================================================== */

let W=0;

let H=0;

let DPR=1;

let cx=0;

let cy=0;

let R=0;

let pts=[];

let level=0;

let target=0;

let mode="idle";


/* AUDIO */

let audioCtx=null;

let analyser=null;

let audioData=null;

let stream=null;


/* SPEECH */

let recognition=null;

let recognizing=false;

let speaking=false;


/* VOICE SETTING */

let voiceEnabled=true;


/* MEMORY */

let conversation=[];


/* =====================================================
   MEMORY STORAGE
===================================================== */

function loadMemory(){

try{

const saved =
localStorage.getItem("ayai_memory");

if(saved){

conversation=
JSON.parse(saved);

if(!Array.isArray(conversation)){

conversation=[];

}

}

}catch(e){

conversation=[];

}

}


function saveMemory(){

try{

localStorage.setItem(
"ayai_memory",
JSON.stringify(
conversation.slice(-30)
)
);

}catch(e){}

}


function clearMemory(){

conversation=[];

try{

localStorage.removeItem(
"ayai_memory"
);

}catch(e){}

answerBox.textContent=
"تم مسح ذاكرة المحادثة.";

app.classList.add("answer-active");

}


/* =====================================================
   SCREEN
===================================================== */

function resize(){

DPR=
Math.min(
window.devicePixelRatio||1,
2
);

W=
window.innerWidth;

H=
window.innerHeight;

canvas.width=
Math.max(
1,
Math.floor(W*DPR)
);

canvas.height=
Math.max(
1,
Math.floor(H*DPR)
);

ctx.setTransform(
DPR,
0,
0,
DPR,
0,
0
);

cx=W/2;

cy=H/2;

R=
Math.min(W,H)*.235;

makePts();

}


/* =====================================================
   PARTICLES
===================================================== */

function makePts(){

pts=[];

const n=
Math.max(
120,
Math.floor(
Math.min(W,H)*.38
)
);

for(
let i=0;
i<n;
i++
){

pts.push({

a:
Math.random()*Math.PI*2,

r:
R*
(.78+
Math.random()*.29),

s:
(Math.random()-.5)*.001,

ph:
Math.random()*Math.PI*2,

op:
.2+
Math.random()*.7,

z:
Math.random()

});

}

}


/* =====================================================
   MODE
===================================================== */

function setMode(m,text){

mode=m;

status.textContent=text;

}


/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer(text){

if(!text){

answerBox.textContent="";

app.classList.remove(
"answer-active"
);

return;

}

answerBox.textContent=text;

app.classList.add(
"answer-active"
);

}


/* =====================================================
   HIDE ANSWER
===================================================== */

function hideAnswer(){

app.classList.remove(
"answer-active"
);

}


/* =====================================================
   AYAI ORB
===================================================== */

function animate(t){

ctx.clearRect(
0,
0,
W,
H
);

const time=
t*.001;

let measured=0;


if(
analyser &&
audioData
){

analyser.getByteTimeDomainData(
audioData
);

let sum=0;

for(
let i=0;
i<audioData.length;
i++
){

const v=
(audioData[i]-128)/128;

sum+=v*v;

}

measured=
Math.min(
1,
Math.sqrt(
sum/audioData.length
)*4.5
);

}


target=
Math.max(

measured,

mode==="listening"
? .035

:

mode==="speaking"
? .06

:

mode==="thinking"
? .025

:

.012

);


level+=
(target-level)*.1;


/* =================================================
   GLOW
================================================= */

const glow=
ctx.createRadialGradient(
cx,
cy,
R*.1,
cx,
cy,
R*1.55
);

glow.addColorStop(
0,
`rgba(
60,
170,
255,
${.025+level*.09}
)`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*1.55,
0,
Math.PI*2
);

ctx.fill();


/* =================================================
   RINGS
================================================= */

for(
let k=0;
k<3;
k++
){

ctx.beginPath();

ctx.arc(

cx,
cy,

R*(1+k*.035)
+
Math.sin(
time*1.5+k
)*2
+
level*12,

0,
Math.PI*2

);

ctx.strokeStyle=
`rgba(
120,
210,
255,
${.045+level*.025}
)`;

ctx.lineWidth=.6;

ctx.stroke();

}


/* =================================================
   PARTICLES
================================================= */

for(
let i=0;
i<pts.length;
i++
){

const p=pts[i];

p.a+=
p.s*
(1+level*10);

const rr=
p.r+
Math.sin(
time*
(.8+p.z*.9)
+
p.ph
)*
(3+level*28);

const x=
cx+
Math.cos(p.a)*rr;

const y=
cy+
Math.sin(p.a)*rr;


/* connections */

for(
let j=i+1;
j<Math.min(
i+7,
pts.length
);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(
time*
(.8+q.z*.9)
+
q.ph
)*
(3+level*28);

const qx=
cx+
Math.cos(q.a)*qrr;

const qy=
cy+
Math.sin(q.a)*qrr;

const d=
Math.hypot(
x-qx,
y-qy
);

if(d<72){

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
qx,
qy
);

ctx.strokeStyle=
`rgba(
150,
225,
255,
${Math.max(
0,
(.17-d/520)*
(.7+level*2.3)
)}
)`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


/* particle */

ctx.beginPath();

ctx.arc(
x,
y,
p.op*.8+
level*1.8,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(
210,
242,
255,
${Math.min(
1,
p.op*
(.45+level*1.5)
)}
)`;

ctx.shadowBlur=
7+
level*15;

ctx.shadowColor=
"#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


/* =================================================
   ROTATING ARCS
================================================= */

for(
let k=0;
k<4;
k++
){

const a=
time*
(.18+k*.035)*
(k%2?1:-1)
+
k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(
190,
238,
255,
${.22+level*.55}
)`;

ctx.lineWidth=
1.1+
level*2;

ctx.stroke();

}


requestAnimationFrame(
animate
);

}


/* =====================================================
   MICROPHONE
===================================================== */

async function setupAudio(){

if(audioCtx){

if(
audioCtx.state==="suspended"
){

await audioCtx.resume();

}

return;

}


if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone unavailable"
);

}


stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});


const AC=
window.AudioContext ||
window.webkitAudioContext;


if(!AC){

return;

}


audioCtx=
new AC();


const src=
audioCtx.createMediaStreamSource(
stream
);


analyser=
audioCtx.createAnalyser();

analyser.fftSize=1024;

audioData=
new Uint8Array(
analyser.fftSize
);

src.connect(analyser);

}


/* =====================================================
   ARABIC VOICE
===================================================== */

function getArabicVoice(){

if(
!("speechSynthesis" in window)
){

return null;

}


const voices=
speechSynthesis.getVoices()||[];


return

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-iq"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-sa"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-ae"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase()
.startsWith("ar")
)

||

null;

}


/* =====================================================
   SPEAK
===================================================== */

function speak(text){

if(!voiceEnabled){

return;

}


if(
!("speechSynthesis" in window)
){

setMode(
"idle",
"VOICE NOT AVAILABLE"
);

return;

}


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(
text
);


const voice=
getArabicVoice();


if(voice){

u.voice=voice;

u.lang=
voice.lang;

}else{

u.lang="ar-SA";

}


u.rate=.9;

u.pitch=.95;

u.volume=1;


speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);


u.onstart=()=>{

speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


u.onend=()=>{

speaking=false;

if(!recognizing){

setMode(
"idle",
"AYAI IS READY"
);

}

};


u.onerror=(e)=>{

console.log(
"Speech error",
e
);

speaking=false;

if(!recognizing){

setMode(
"idle",
"AYAI IS READY"
);

}

};


speechSynthesis.speak(u);


/*
iPhone / Safari sometimes pauses
speech synthesis.
*/

const keepAlive=
setInterval(()=>{

if(!speaking){

clearInterval(
keepAlive
);

return;

}

try{

if(
speechSynthesis.paused
){

speechSynthesis.resume();

}

}catch(e){}

},5000);


}catch(e){

console.error(e);

speaking=false;

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =====================================================
   NORMALIZE ARABIC
===================================================== */

function normalizeArabic(s){

return s

.toLowerCase()

.replace(
/[أإآ]/g,
"ا"
)

.replace(
/ة/g,
"ه"
)

.replace(
/[؟?!.،,]/g,
" "
)

.replace(
/\s+/g,
" "
)

.trim();

}


/* =====================================================
   QUICK COMMANDS
===================================================== */

function quickCommand(text){

const t=
normalizeArabic(text);


/* ---------------------------------------------
   TIME
--------------------------------------------- */

if(
/(شكد|كم|شنو الوقت|الوقت|الساعه|الساعة)/
.test(t)
){

const now=
new Date();

return `الساعة الآن ${
now.toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


/* ---------------------------------------------
   DATE
--------------------------------------------- */

if(
/(
تاريخ اليوم|
شنو التاريخ|
التاريخ|
اليوم شنو
)/
.test(t)
){

const now=
new Date();

return `اليوم ${
now.toLocaleDateString(
"ar-IQ",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
)
}.`;

}


/* ---------------------------------------------
   YOUTUBE
--------------------------------------------- */

if(
/^(افتح|شغل|روح ل|روح)(\s+)?
(يوتيوب|youtube)/
.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";


}


/* ---------------------------------------------
   GOOGLE
--------------------------------------------- */

if(
/^(افتح|روح ل)(\s+)?
(جوجل|گوگل|google)/
.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


/* ---------------------------------------------
   SEARCH
--------------------------------------------- */

let m=
t.match(
/(?:ابحث|دور|ابحثلي|دورلي)
(?: عن)?\s+(.+)/
);


if(m){

const q=
m[1].trim();


if(q){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);

return `بحثتلك عن ${q}.`;

}

}


/* ---------------------------------------------
   CALCULATOR
--------------------------------------------- */

m=
t.match(
/(?:احسب|حساب)\s+(.+)/
);


if(m){

let expr=
m[1]

.replace(
/ضرب|في/g,
"*"
)

.replace(
/قسمة على|قسمه على|على/g,
"/"
)

.replace(
/زائد/g,
"+"
)

.replace(
/ناقص/g,
"-"
)

.replace(
/×/g,
"*"
)

.replace(
/÷/g,
"/"
);


if(
/^[0-9+\-*/().\s]+$/
.test(expr)
){

try{

const result=
Function(
'"use strict";return ('+
expr+
')'
)();


if(
Number.isFinite(result)
){

return `النتيجة هي ${result}.`;

}

}catch(e){}

}

}


/* ---------------------------------------------
   CLEAR MEMORY
--------------------------------------------- */

if(
/(
مسح الذاكره|
امسح الذاكره|
انس كلشي|
انسى كلشي|
امسح الذاكرة|
انس الذاكرة
)/
.test(t)
){

clearMemory();

return "__NO_SPEAK__";

}


return null;

}


/* =====================================================
   AI CHAT
===================================================== */

async function reply(text){

const t=
text.trim();


if(!t){

return;

}


/* QUICK COMMAND */

const quick=
quickCommand(t);


if(quick){

if(
quick!=="__NO_SPEAK__"
){

showAnswer(quick);

speak(quick);

}

return;

}


/* SAVE USER */

conversation.push({

role:"user",

content:t

});

saveMemory();


heard.textContent=
"جاري التفكير...";


app.classList.add(
"thinking"
);

setMode(
"thinking",
"AYAI IS THINKING"
);


/* =================================================
   MEMORY PROMPT
================================================= */

const memoryText=
conversation

.slice(-12)

.map(
m=>
(
m.role==="user"
?
"المستخدم: "
:
"AyAI: "
)
+
m.content
)

.join("\n");


const prompt=

`أنت AyAI، مساعد شخصي ذكي وودود.

تحدث بالعربية، ويمكنك استخدام اللهجة العراقية بشكل طبيعي.

كن مختصراً في الأسئلة البسيطة وواضحاً في الأسئلة المعقدة.

إذا طلب المستخدم حساباً قم بالحساب بدقة.

إذا طلب المستخدم فتح موقع أو البحث، تعامل مع الأمر بشكل مباشر.

هذه ذاكرة المحادثة:

${memoryText}

السؤال الحالي:

${t}

أجب مباشرة عن السؤال الحالي.`;


try{

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
message:prompt
})

}
);


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error||
"API Error"
);

}


const answer=
(
data.answer||
"ما حصلت جواب."
)
.trim();


conversation.push({

role:"assistant",

content:answer

});

saveMemory();


heard.textContent="";

showAnswer(answer);


app.classList.remove(
"thinking"
);


speak(answer);


}catch(error){

console.error(error);


if(
conversation.length &&
conversation[
conversation.length-1
].role==="user"
){

conversation.pop();

saveMemory();

}


const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";


showAnswer(msg);


app.classList.remove(
"thinking"
);


speak(msg);

}

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function startRecognition(){

const SR=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

showAnswer(
"المتصفح الحالي لا يدعم التعرف على الصوت."
);

return;

}


if(recognition){

try{

recognition.abort();

}catch(e){}

}


recognition=
new SR();


recognition.lang=
"ar-IQ";

recognition.continuous=
false;

recognition.interimResults=
true;

recognition.maxAlternatives=
1;


recognition.onstart=()=>{

recognizing=true;

mic.classList.add(
"on"
);

hideAnswer();

setMode(
"listening",
"LISTENING..."
);

heard.textContent="";

};


recognition.onresult=e=>{

let finalText="";

let interim="";


for(
let i=e.resultIndex;
i<e.results.length;
i++
){

const tx=
e.results[i][0]
.transcript;


if(
e.results[i].isFinal
){

finalText+=tx;

}else{

interim+=tx;

}

}


heard.textContent=
finalText||
interim;


if(finalText){

reply(finalText);

}

};


recognition.onerror=e=>{

recognizing=false;

mic.classList.remove(
"on"
);


if(
e.error==="not-allowed" ||
e.error==="service-not-allowed"
){

setMode(
"idle",
"MICROPHONE DENIED"
);

showAnswer(
"اسمح للمتصفح باستخدام الميكروفون."
);

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


recognition.onend=()=>{

recognizing=false;

mic.classList.remove(
"on"
);

if(!speaking){

setMode(
"idle",
"AYAI IS READY"
);

}

};


try{

recognition.start();

}catch(e){

recognizing=false;

mic.classList.remove(
"on"
);

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =====================================================
   MOBILE AUDIO UNLOCK
===================================================== */

function unlockSpeech(){

if(
!("speechSynthesis" in window)
){

return;

}


try{

speechSynthesis.cancel();


const u=
new SpeechSynthesisUtterance(
" "
);

u.volume=0;

u.rate=10;


speechSynthesis.speak(u);


setTimeout(
()=>{

try{

speechSynthesis.cancel();

}catch(e){}

},
100
);

}catch(e){}

}


/* =====================================================
   VOICE TOGGLE
===================================================== */

voiceToggle.addEventListener(
"click",
()=>{

voiceEnabled=
!voiceEnabled;


if(voiceEnabled){

voiceToggle.classList.add(
"on"
);

voiceToggle.classList.remove(
"off"
);

voiceToggle.title=
"Voice On";

}else{

voiceToggle.classList.remove(
"on"
);

voiceToggle.classList.add(
"off"
);

voiceToggle.title=
"Voice Off";


if(
"speechSynthesis"
in window
){

speechSynthesis.cancel();

}

}

}
);


/* =====================================================
   MICROPHONE BUTTON
===================================================== */

mic.addEventListener(
"click",
async()=>{

try{

if(recognizing){

if(recognition){

recognition.stop();

}

return;

}


/*
فتح الصوت من ضغطة المستخدم
مهم جداً للـ iPhone
*/

unlockSpeech();


if(
"speechSynthesis"
in window
){

speechSynthesis.cancel();

}


await setupAudio();


startRecognition();


}catch(e){

console.error(e);


setMode(
"idle",
"MICROPHONE ACCESS REQUIRED"
);


showAnswer(
"فعّل صلاحية الميكروفون للمتابعة."
);

}

});


/* =====================================================
   NAME DOUBLE TAP / RESET ANSWER
===================================================== */

let lastTap=0;


name.addEventListener(
"click",
()=>{

const now=
Date.now();


if(
now-lastTap<350
){

hideAnswer();

heard.textContent="";

setMode(
"idle",
"AYAI IS READY"
);

}


lastTap=now;

});


/* =====================================================
   SPEECH VOICES LOADING
===================================================== */

if(
"speechSynthesis" in window
){

speechSynthesis.onvoiceschanged=()=>{

speechSynthesis.getVoices();

};

}


/* =====================================================
   START
===================================================== */

loadMemory();


memoryStatus.classList.add(
"on"
);


window.addEventListener(
"resize",
resize,
{passive:true}
);


resize();


requestAnimationFrame(
animate
);


})();

</script>
