border:1px solid rgba(110,210,255,.28);

.devTitle{

#devFiles{

}

top:13%;
font-size:9px
}

#name{
font-size:52px;
letter-spacing:7px

#app.active #name{
top:31%;
font-size:42px
}

#answerBox{
top:50%;
width:89vw;
max-height:29vh
}

#heard{
top:63%;
width:87vw;
font-size:14px
}

#tip{
font-size:8px;
letter-spacing:1px
}

right:5%;
bottom:6.2%;
width:38px;
height:38px
}

<div id="app">

<canvas id="orb"></canvas>

<script>

(function(){

"use strict";

/* =========================================
   ELEMENTS
========================================= */

const canvas=document.getElementById("orb");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");
const memoryStatus=document.getElementById("memoryStatus");
const name=document.getElementById("name");
const heard=document.getElementById("heard");
const answerBox=document.getElementById("answerBox");
const answerText=document.getElementById("answerText");

const mic=document.getElementById("mic");
const voiceToggle=document.getElementById("voiceToggle");
const app=document.getElementById("app");

const developPanel=document.getElementById("developPanel");
const devPlan=document.getElementById("devPlan");
const devFiles=document.getElementById("devFiles");
const devStatus=document.getElementById("devStatus");
const approveBtn=document.getElementById("approveBtn");
const cancelBtn=document.getElementById("cancelBtn");


/* =========================================
   VARIABLES
========================================= */

let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
let pts=[];
let level=0;
let target=0;
let mode="idle";

let audioCtx=null;
let analyser=null;
let audioData=null;
let stream=null;

let recognition=null;
let recognizing=false;
let speaking=false;
let handsFree=false;
let waitingForReply=false;
let restartTimer=null;

let voiceEnabled=true;

let conversation=[];

const MEMORY_KEY="ayai_conversation_memory_v2";

let currentProposal=null;


/* =========================================
   MEMORY
========================================= */

function loadMemory(){

try{

const saved=localStorage.getItem(MEMORY_KEY);

if(saved){

const data=JSON.parse(saved);

if(Array.isArray(data)){
conversation=data.slice(-30);
}

}

memoryStatus.textContent="MEMORY: ON";

}catch(e){

conversation=[];

memoryStatus.textContent="MEMORY: OFF";

}

}

function saveMemory(){

try{

localStorage.setItem(
MEMORY_KEY,
JSON.stringify(conversation.slice(-30))
);

}catch(e){}

}


/* =========================================
   UI
========================================= */

function setMode(m,text){

mode=m;
status.textContent=text;

}

function showAnswer(text){

answerText.textContent=text||"";
answerBox.classList.add("show");

}

function hideAnswer(){

answerBox.classList.remove("show");

}


/* =========================================
   SCREEN
========================================= */

function resize(){

DPR=Math.min(window.devicePixelRatio||1,2);

W=window.innerWidth;
H=window.innerHeight;

canvas.width=Math.max(1,Math.floor(W*DPR));
canvas.height=Math.max(1,Math.floor(H*DPR));

ctx.setTransform(DPR,0,0,DPR,0,0);

cx=W/2;
cy=H/2;

R=Math.min(W,H)*.235;

makePts();

}

function makePts(){

pts=[];

const n=Math.max(
120,
Math.floor(Math.min(W,H)*.38)
);

for(let i=0;i<n;i++){

pts.push({

a:Math.random()*Math.PI*2,
r:R*(.78+Math.random()*.29),
s:(Math.random()-.5)*.001,
ph:Math.random()*Math.PI*2,
op:.2+Math.random()*.7,
z:Math.random()

});

}

}


/* =========================================
   ORB
========================================= */

function animate(t){

ctx.clearRect(0,0,W,H);

const time=t*.001;

let measured=0;

if(analyser&&audioData){

analyser.getByteTimeDomainData(audioData);

let sum=0;

for(let i=0;i<audioData.length;i++){

const v=(audioData[i]-128)/128;
sum+=v*v;

}

measured=Math.min(
1,
Math.sqrt(sum/audioData.length)*4.5
);

}

target=Math.max(

measured,

mode==="listening"?.035:
mode==="speaking"?.06:
mode==="thinking"?.025:
.012

);

level+=(target-level)*.1;


/* glow */

const glow=ctx.createRadialGradient(
cx,cy,R*.1,
cx,cy,R*1.55
);

glow.addColorStop(
0,
`rgba(60,170,255,${.025+level*.09})`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();
ctx.arc(cx,cy,R*1.55,0,Math.PI*2);
ctx.fill();


/* rings */

for(let k=0;k<3;k++){

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1+k*.035)+Math.sin(time*1.5+k)*2+level*12,
0,
Math.PI*2
);

ctx.strokeStyle=
`rgba(120,210,255,${.045+level*.025})`;

ctx.lineWidth=.6;

ctx.stroke();

}


/* particles */

for(let i=0;i<pts.length;i++){

const p=pts[i];

p.a+=p.s*(1+level*10);

const rr=
p.r+
Math.sin(time*(.8+p.z*.9)+p.ph)*
(3+level*28);

const x=cx+Math.cos(p.a)*rr;
const y=cy+Math.sin(p.a)*rr;


/* connections */

for(
let j=i+1;
j<Math.min(i+7,pts.length);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(time*(.8+q.z*.9)+q.ph)*
(3+level*28);

const qx=cx+Math.cos(q.a)*qrr;
const qy=cy+Math.sin(q.a)*qrr;

const d=Math.hypot(x-qx,y-qy);

if(d<72){

ctx.beginPath();

ctx.moveTo(x,y);
ctx.lineTo(qx,qy);

ctx.strokeStyle=
`rgba(150,225,255,${Math.max(
0,
(.17-d/520)*(.7+level*2.3)
)})`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


ctx.beginPath();

ctx.arc(
x,
y,
p.op*.8+level*1.8,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(210,242,255,${Math.min(
1,
p.op*(.45+level*1.5)
)})`;

ctx.shadowBlur=7+level*15;
ctx.shadowColor="#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


/* rotating arcs */

for(let k=0;k<4;k++){

const a=
time*(.18+k*.035)*(k%2?1:-1)+k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(190,238,255,${.22+level*.55})`;

ctx.lineWidth=1.1+level*2;

ctx.stroke();

}

requestAnimationFrame(animate);

}


/* =========================================
   AUDIO
========================================= */

async function setupAudio(){

if(audioCtx){

if(audioCtx.state==="suspended"){
await audioCtx.resume();
}

return;

}

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error("Microphone unavailable");

}

stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

audioCtx=new AC();

const src=
audioCtx.createMediaStreamSource(stream);

analyser=
audioCtx.createAnalyser();

analyser.fftSize=1024;

audioData=
new Uint8Array(analyser.fftSize);

src.connect(analyser);

}


/* =========================================
   VOICE
========================================= */

function getArabicVoice(){

if(!("speechSynthesis" in window))return null;

const voices=speechSynthesis.getVoices()||[];

return voices.find(v=>
(v.lang||"").toLowerCase()==="ar-iq"
)||voices.find(v=>
(v.lang||"").toLowerCase().startsWith("ar")
)||null;

}

function speak(text){

if(!voiceEnabled){

resumeConversation();
return;

}

if(!("speechSynthesis" in window)){

resumeConversation();
return;

}

try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

const voice=getArabicVoice();

if(voice){

u.voice=voice;
u.lang=voice.lang;

}else{

u.lang="ar-SA";

}

u.rate=.9;
u.pitch=.95;
u.volume=1;

speaking=true;

app.classList.add("active");

setMode(
"speaking",
"AYAI IS SPEAKING"
);

u.onend=()=>{

speaking=false;

app.classList.remove("active");

if(handsFree){

waitingForReply=false;
scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};

u.onerror=()=>{

speaking=false;

app.classList.remove("active");

resumeConversation();

};

speechSynthesis.speak(u);

}catch(e){

speaking=false;
resumeConversation();

}

}


/* =========================================
   NORMALIZE
========================================= */

function normalizeArabic(s){

return s
.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ة/g,"ه")
.replace(/[؟?!.،,]/g," ")
.replace(/\s+/g," ")
.trim();

}


/* =========================================
   QUICK COMMANDS
========================================= */

function quickCommand(text){

const t=normalizeArabic(text);


/* time */

if(
/(شكد|كم|شنو الوقت|الوقت|الساعه|الساعة)/
.test(t)
){

return `الساعة الآن ${
new Date().toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


/* youtube */

if(
/^(افتح|شغل|روح ل)\s*(يوتيوب|youtube)/
.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";

}


/* google */

if(
/^(افتح|روح ل)\s*(جوجل|گوگل|google)/
.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


/* calculator */

let m=t.match(
/(?:احسب|حساب)\s+(.+)/
);

if(m){

let expr=m[1]
.replace(/ضرب|في/g,"*")
.replace(/قسمة على|قسمه على|على/g,"/")
.replace(/زائد/g,"+")
.replace(/ناقص/g,"-")
.replace(/×/g,"*")
.replace(/÷/g,"/");

if(/^[0-9+\-*/().\s]+$/.test(expr)){

try{

const result=
Function(
'"use strict";return ('+expr+')'
)();

if(Number.isFinite(result)){

return `النتيجة هي ${result}.`;

}

}catch(e){}

}

}


/* clear memory */

if(
/(مسح الذاكره|امسح الذاكره|انس كلشي|انسى كلشي)/
.test(t)
){

conversation=[];

localStorage.removeItem(MEMORY_KEY);

return "تم مسح ذاكرة المحادثة.";

}

return null;

}


/* =========================================
   DEVELOPMENT INTENT
========================================= */

function isDevelopmentRequest(text){

const t=normalizeArabic(text);

return /(
طور|
طوره|
طور نفسك|
طور كودك|
عدل كودك|
غير كودك|
اضف ميزه|
اضيف ميزه|
سوي ميزه|
تطوير|
برمج|
برمجه|
حسن النظام|
حسن نفسك|
upgrade|
develop|
development
)/i.test(t);

}


/* =========================================
   ASK DEVELOPMENT PLAN
========================================= */

async function requestDevelopmentPlan(userRequest){

setMode(
"thinking",
"AYAI IS PLANNING"
);

showAnswer("جاري إعداد خطة التطوير...");

try{

const response=
await fetch(
"/api/develop",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"propose",

request:userRequest

})

});

const data=await response.json();

if(!response.ok){

throw new Error(
data.error||"Development planning failed"
);

}

currentProposal=data;

devPlan.textContent=
data.plan||"لا توجد خطة.";

devFiles.textContent=
(data.files||[]).join("\n");

devStatus.textContent=
"بانتظار موافقتك. AyAI لن يغير أي ملف قبل الموافقة.";

developPanel.classList.add("show");

setMode(
"idle",
"DEVELOPMENT PROPOSAL"
);

hideAnswer();

}catch(error){

console.error(error);

showAnswer(
"ما كدرت أجهز خطة التطوير: "+
error.message
);

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =========================================
   APPROVE DEVELOPMENT
========================================= */

approveBtn.addEventListener(
"click",
async()=>{

if(!currentProposal)return;

approveBtn.disabled=true;
cancelBtn.disabled=true;

devStatus.textContent=
"جاري تطبيق التطوير...";

setMode(
"thinking",
"AYAI IS DEVELOPING"
);

try{

const response=
await fetch(
"/api/develop",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"approve",

proposalId:
currentProposal.proposalId,

approvalToken:
currentProposal.approvalToken

})

});

const data=await response.json();

if(!response.ok){

throw new Error(
data.error||"Development failed"
);

}

devStatus.textContent=
"تم التطوير بنجاح. Commit: "+
(data.commit||"OK");

showAnswer(
"تم تنفيذ التطوير بعد موافقتك. سيتم نشر التحديث من Vercel."
);

developPanel.classList.remove("show");

speak(
"تم تنفيذ التطوير بعد موافقتك. سيتم نشر التحديث."
);

currentProposal=null;

}catch(error){

console.error(error);

devStatus.textContent=
"فشل التطوير: "+error.message;

showAnswer(
"فشل تنفيذ التطوير: "+
error.message
);

setMode(
"idle",
"AYAI IS READY"
);

}finally{

approveBtn.disabled=false;
cancelBtn.disabled=false;

}

});


/* =========================================
   CANCEL
========================================= */

cancelBtn.addEventListener(
"click",
()=>{

currentProposal=null;

developPanel.classList.remove("show");

devStatus.textContent=
"Waiting for your approval.";

setMode(
"idle",
"AYAI IS READY"
);

}
);


/* =========================================
   AI CHAT
========================================= */

async function reply(text){

const t=text.trim();

if(!t)return;


/* development */

if(isDevelopmentRequest(t)){

await requestDevelopmentPlan(t);

return;

}


/* quick command */

const quick=quickCommand(t);

if(quick){

showAnswer(quick);

heard.textContent="";

if(voiceEnabled){

speak(quick);

}else{

resumeConversation();

}

return;

}


/* memory */

conversation.push({
role:"user",
content:t
});

saveMemory();

showAnswer("");

heard.textContent="جاري التفكير...";

app.classList.add("active");

setMode(
"thinking",
"AYAI IS THINKING"
);

const memoryText=
conversation
.slice(-14)
.map(m=>
(m.role==="user"?"المستخدم: ":"AyAI: ")+m.content
)
.join("\n");

try{

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:t,
memory:memoryText

})

});

const data=await response.json();

if(!response.ok){

throw new Error(
data.error||"API Error"
);

}

const answer=
(data.answer||"ما حصلت جواب.").trim();

conversation.push({
role:"assistant",
content:answer
});

saveMemory();

showAnswer(answer);

heard.textContent="";

if(voiceEnabled){

speak(answer);

}else{

app.classList.remove("active");

resumeConversation();

}

}catch(error){

console.error(error);

const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";

showAnswer(msg);

heard.textContent="";

if(voiceEnabled){

speak(msg);

}else{

app.classList.remove("active");

resumeConversation();

}

}

}


/* =========================================
   SPEECH RECOGNITION
========================================= */

function startRecognition(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

return;

}

if(!handsFree||recognizing)return;

if(recognition){

try{
recognition.abort();
}catch(e){}

}

recognition=new SR();

recognition.lang="ar-IQ";
recognition.continuous=false;
recognition.interimResults=true;
recognition.maxAlternatives=1;

recognition.onstart=()=>{

recognizing=true;
waitingForReply=false;

mic.classList.add("on");
app.classList.add("active");

setMode(
"listening",
"LISTENING..."
);

heard.textContent="";

};

recognition.onresult=e=>{

let finalText="";
let interim="";

for(
let i=e.resultIndex;
i<e.results.length;
i++
){

const tx=
e.results[i][0].transcript;

if(e.results[i].isFinal){

finalText+=tx;

}else{

interim+=tx;

}

}

heard.textContent=
finalText||interim;

if(finalText){

waitingForReply=true;

try{
recognition.stop();
}catch(e){}

reply(finalText);

}

};

recognition.onerror=e=>{

recognizing=false;

mic.classList.remove("on");

if(
e.error==="not-allowed"||
e.error==="service-not-allowed"
){

handsFree=false;

setMode(
"idle",
"MICROPHONE DENIED"
);

return;

}

if(
handsFree&&!speaking&&!waitingForReply
){

scheduleRecognition();

}

};

recognition.onend=()=>{

recognizing=false;

mic.classList.remove("on");

if(
handsFree&&!speaking&&!waitingForReply
){

scheduleRecognition();

}

};

try{

recognition.start();

}catch(e){

recognizing=false;

mic.classList.remove("on");

if(handsFree){

scheduleRecognition();

}

}

}


/* =========================================
   AUTO LISTEN
========================================= */

function scheduleRecognition(){

if(!handsFree||recognizing||speaking)return;

if(restartTimer){

clearTimeout(restartTimer);

}

restartTimer=setTimeout(()=>{

if(
handsFree&&!recognizing&&!speaking&&!waitingForReply
){

startRecognition();

}

},650);

}

function resumeConversation(){

waitingForReply=false;

if(handsFree&&!speaking){

setMode(
"listening",
"LISTENING..."
);

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =========================================
   AUDIO UNLOCK
========================================= */

function unlockSpeech(){

if(!("speechSynthesis" in window))return;

try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(" ");

u.volume=0;
u.rate=10;

speechSynthesis.speak(u);

setTimeout(()=>{
try{
speechSynthesis.cancel();
}catch(e){}
},100);

}catch(e){}

}


/* =========================================
   VOICE TOGGLE
========================================= */

voiceToggle.addEventListener(
"click",
()=>{

voiceEnabled=!voiceEnabled;

voiceToggle.classList.toggle(
"active",
voiceEnabled
);

if(!voiceEnabled){

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

speaking=false;

}else{

unlockSpeech();

}

}
);


/* =========================================
   MIC
========================================= */

mic.addEventListener(
"click",
async()=>{

try{

/* stop */

if(handsFree){

handsFree=false;
waitingForReply=false;

if(restartTimer){

clearTimeout(restartTimer);
restartTimer=null;

}

if(recognition){

try{
recognition.abort();
}catch(e){}

}

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

speaking=false;
recognizing=false;

mic.classList.remove("on");
app.classList.remove("active");

setMode(
"idle",
"AYAI IS READY"
);

heard.textContent=
"تم إيقاف الاستماع.";

return;

}


/* start */

handsFree=true;
waitingForReply=false;

unlockSpeech();

await setupAudio();

startRecognition();

}catch(e){

console.error(e);

handsFree=false;

setMode(
"idle",
"MICROPHONE ACCESS REQUIRED"
);

heard.textContent=
"فعّل صلاحية الميكروفون للمتابعة.";

}

});


/* =========================================
   START
========================================= */

loadMemory();

if("speechSynthesis" in window){

speechSynthesis.getVoices();

}

window.addEventListener(
"resize",
resize,
{passive:true}
);

resize();

requestAnimationFrame(animate);

voiceToggle.classList.add("active");

})();

</script>
