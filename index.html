<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AyAI — Voice Assistant</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eef9ff;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{min-height:100dvh}
#app{width:100%;height:100%;min-height:100dvh;position:relative;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;top:8%;left:50%;transform:translateX(-50%);direction:ltr;font-size:17px;letter-spacing:3px;font-weight:300;white-space:nowrap;text-shadow:0 0 18px #78cfff;transition:.25s;z-index:2}
#status:before,#status:after{content:"";display:inline-block;width:65px;height:1px;vertical-align:middle;margin:0 17px;background:linear-gradient(90deg,transparent,#72caff)}
#status:after{background:linear-gradient(90deg,#72caff,transparent)}
#name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(45px,7vw,88px);font-weight:200;letter-spacing:9px;direction:ltr;text-shadow:0 0 25px rgba(130,210,255,.65);pointer-events:none;z-index:2}
#heard{position:absolute;left:50%;top:65%;transform:translateX(-50%);width:min(700px,80vw);text-align:center;color:rgba(220,242,252,.72);font-size:15px;line-height:1.7;min-height:28px;direction:rtl;z-index:2}
#mic{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:1px solid rgba(145,220,255,.35);background:#030a0f;color:#d9f5ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 24px rgba(80,190,255,.12);transition:.25s;z-index:3;-webkit-tap-highlight-color:transparent}
#mic:hover,#mic.on{border-color:#bdeaff;box-shadow:0 0 34px rgba(80,200,255,.45),inset 0 0 18px rgba(80,180,255,.12)}
#mic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5}
#tip{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1.7px;color:#53707e;direction:ltr;white-space:nowrap;z-index:2}
@media(max-width:600px){
  #status{font-size:12px;letter-spacing:2px;top:7%}
  #status:before,#status:after{width:28px;margin:0 8px}
  #name{font-size:52px;letter-spacing:7px}
  #heard{top:64%;width:86vw;font-size:14px}
  #tip{font-size:8px;letter-spacing:1.1px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="orb"></canvas>
<div id="status">AYAI IS READY</div>
<div id="name">AyAI</div>
<div id="heard"></div>
<button id="mic" type="button" aria-label="Start AyAI">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"/></svg>
</button>
<div id="tip">TAP TO SPEAK • SAY “HEY AYAI”</div>
</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("orb");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const heard=document.getElementById("heard");
const mic=document.getElementById("mic");

let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
let pts=[],level=0,target=0,mode="idle";
let audioCtx=null,analyser=null,data=null,stream=null;
let recognition=null,recognizing=false,speaking=false;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=Math.max(1,Math.floor(W*DPR));
  canvas.height=Math.max(1,Math.floor(H*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;
  cy=H/2;
  R=Math.min(W,H)*.235;
  makePts();
}

function makePts(){
  pts=[];
  const n=Math.max(120,Math.floor(Math.min(W,H)*.38));
  for(let i=0;i<n;i++){
    pts.push({
      a:Math.random()*Math.PI*2,
      r:R*(.78+Math.random()*.29),
      s:(Math.random()-.5)*.001,
      ph:Math.random()*Math.PI*2,
      op:.2+Math.random()*.7,
      z:Math.random()
    });
  }
}

function setMode(m,text){
  mode=m;
  status.textContent=text;
}

function animate(t){
  ctx.clearRect(0,0,W,H);
  const time=t*.001;
  let measured=0;

  if(analyser&&data){
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){
      const v=(data[i]-128)/128;
      sum+=v*v;
    }
    measured=Math.min(1,Math.sqrt(sum/data.length)*4.5);
  }

  target=Math.max(
    measured,
    mode==="listening" ? .035 :
    mode==="speaking" ? .06 : .012
  );
  level+=(target-level)*.1;

  const glow=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*1.55);
  glow.addColorStop(0,`rgba(60,170,255,${.025+level*.09})`);
  glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(cx,cy,R*1.55,0,Math.PI*2);
  ctx.fill();

  for(let k=0;k<3;k++){
    ctx.beginPath();
    ctx.arc(
      cx,cy,
      R*(1+k*.035)+Math.sin(time*1.5+k)*2+level*12,
      0,Math.PI*2
    );
    ctx.strokeStyle=`rgba(120,210,255,${.045+level*.025})`;
    ctx.lineWidth=.6;
    ctx.stroke();
  }

  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    p.a+=p.s*(1+level*10);
    const rr=p.r+Math.sin(time*(.8+p.z*.9)+p.ph)*(3+level*28);
    const x=cx+Math.cos(p.a)*rr;
    const y=cy+Math.sin(p.a)*rr;

    for(let j=i+1;j<Math.min(i+7,pts.length);j++){
      const q=pts[j];
      const qrr=q.r+Math.sin(time*(.8+q.z*.9)+q.ph)*(3+level*28);
      const qx=cx+Math.cos(q.a)*qrr;
      const qy=cy+Math.sin(q.a)*qrr;
      const d=Math.hypot(x-qx,y-qy);
      if(d<72){
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(qx,qy);
        ctx.strokeStyle=`rgba(150,225,255,${Math.max(0,(.17-d/520)*(0.7+level*2.3))})`;
        ctx.lineWidth=.45;
        ctx.stroke();
      }
    }

    ctx.beginPath();
    ctx.arc(x,y,p.op*.8+level*1.8,0,Math.PI*2);
    ctx.fillStyle=`rgba(210,242,255,${Math.min(1,p.op*(.45+level*1.5))})`;
    ctx.shadowBlur=7+level*15;
    ctx.shadowColor="#79cfff";
    ctx.fill();
    ctx.shadowBlur=0;
  }

  for(let k=0;k<4;k++){
    const a=time*(.18+k*.035)*(k%2?1:-1)+k*1.6;
    ctx.beginPath();
    ctx.arc(cx,cy,R*(1.01+level*.03),a,a+.65+level*1.1);
    ctx.strokeStyle=`rgba(190,238,255,${.22+level*.55})`;
    ctx.lineWidth=1.1+level*2;
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}

async function setupAudio(){
  if(audioCtx){
    if(audioCtx.state==="suspended") await audioCtx.resume();
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("Microphone API unavailable");
  }

  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;

  audioCtx=new AC();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  data=new Uint8Array(analyser.fftSize);
  src.connect(analyser);
}

function speak(text){
  if(!("speechSynthesis" in window)){
    setMode("idle","AYAI IS READY");
    return;
  }

  speechSynthesis.cancel();
  speaking=true;
  setMode("speaking","AYAI IS SPEAKING");

  const u=new SpeechSynthesisUtterance(text);
  u.lang="ar-IQ";
  u.rate=.95;
  u.pitch=.92;
  u.volume=1;

  u.onend=()=>{
    speaking=false;
    if(!recognizing) setMode("idle","AYAI IS READY");
  };
  u.onerror=()=>{
    speaking=false;
    if(!recognizing) setMode("idle","AYAI IS READY");
  };

  speechSynthesis.speak(u);
}

async function reply(text){
  let t = text.trim();
  if(!t) return;

  heard.textContent = "جاري التفكير...";
  setMode("speaking","AYAI IS THINKING");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: t
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "API Error");
    }

    const answer = data.answer || "ما حصلت جواب.";

    heard.textContent = answer;
    speak(answer);

  } catch(error) {
    console.error(error);

    const answer =
      "صار عندي خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";

    heard.textContent = answer;
    speak(answer);
  }
}

function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    setMode("idle","VOICE NOT SUPPORTED");
    heard.textContent="المتصفح الحالي لا يدعم التعرف على الصوت.";
    return;
  }

  if(recognition){
    try{ recognition.abort(); }catch(e){}
  }

  recognition=new SR();
  recognition.lang="ar-IQ";
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    recognizing=true;
    mic.classList.add("on");
    setMode("listening","LISTENING...");
    heard.textContent="";
  };

  recognition.onresult=(e)=>{
    let finalText="";
    let interim="";

    for(let i=e.resultIndex;i<e.results.length;i++){
      const tx=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText+=tx;
      else interim+=tx;
    }

    heard.textContent=finalText||interim;
    if(finalText) reply(finalText);
  };

  recognition.onerror=(e)=>{
    recognizing=false;
    mic.classList.remove("on");

    if(e.error==="not-allowed" || e.error==="service-not-allowed"){
      setMode("idle","MICROPHONE DENIED");
      heard.textContent="اسمح للمتصفح باستخدام الميكروفون.";
    }else{
      setMode("idle","AYAI IS READY");
    }
  };

  recognition.onend=()=>{
    recognizing=false;
    mic.classList.remove("on");
    if(!speaking) setMode("idle","AYAI IS READY");
  };

  try{
    recognition.start();
  }catch(e){
    recognizing=false;
    mic.classList.remove("on");
    setMode("idle","AYAI IS READY");
  }
}

mic.addEventListener("click",async()=>{
  try{
    if(recognizing){
      if(recognition) recognition.stop();
      return;
    }

    if("speechSynthesis" in window) speechSynthesis.cancel();
    await setupAudio();
    startRecognition();
  }catch(e){
    setMode("idle","MICROPHONE ACCESS REQUIRED");
    heard.textContent="فعّل صلاحية الميكروفون للمتابعة.";
  }
});

window.addEventListener("resize",resize,{passive:true});
resize();
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
