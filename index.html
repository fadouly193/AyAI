content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AyAI — Advanced Voice Assistant</title>

<style>

*{
box-sizing:border-box;
}

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#eef9ff;

font-family:
Inter,
"Segoe UI",
Arial,
sans-serif;

}

body{
min-height:100dvh;
}

#app{

width:100%;
height:100%;
min-height:100dvh;

position:relative;

background:
radial-gradient(
circle at center,
rgba(20,70,100,.08),
#000 58%
);

overflow:hidden;

}

canvas{

position:absolute;
inset:0;

width:100%;
height:100%;

display:block;

}


/* =========================
STATUS
========================= */

#status{

position:absolute;

top:7%;
left:50%;

transform:translateX(-50%);

direction:ltr;

font-size:16px;

letter-spacing:3px;

font-weight:300;

white-space:nowrap;

text-shadow:
0 0 18px #78cfff;

z-index:5;

}

#status:before,
#status:after{

content:"";

display:inline-block;

width:55px;

height:1px;

vertical-align:middle;

margin:0 15px;

background:
linear-gradient(
90deg,
transparent,
#72caff
);

}

#status:after{

background:
linear-gradient(
90deg,
#72caff,
transparent
);

}


/* =========================
MEMORY
========================= */

#memoryStatus{

position:absolute;

top:13%;

right:4%;

font-size:10px;

letter-spacing:1.5px;

color:#466b7a;

direction:ltr;

z-index:5;

}


/* =========================
NAME
========================= */

#name{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

font-size:
clamp(45px,7vw,88px);

font-weight:200;

letter-spacing:9px;

direction:ltr;

text-shadow:
0 0 25px rgba(130,210,255,.65);

pointer-events:none;

z-index:4;

transition:

top .8s ease,
transform .8s ease,
font-size .8s ease,
text-shadow .4s ease;

}

#app.active #name{

top:33%;

font-size:
clamp(32px,5vw,62px);

text-shadow:
0 0 35px rgba(130,210,255,.9);

}


/* =========================
ANSWER
========================= */

#answerBox{

position:absolute;

left:50%;
top:53%;

transform:
translateX(-50%)
translateY(10px);

width:min(720px,88vw);

max-height:25vh;

overflow-y:auto;

padding:15px 19px;

border:
1px solid
rgba(130,215,255,.18);

border-radius:17px;

background:
rgba(3,10,15,.78);

box-shadow:

0 0 30px
rgba(70,190,255,.08),

inset 0 0 25px
rgba(80,190,255,.035);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

opacity:0;

visibility:hidden;

transition:

opacity .35s ease,
transform .35s ease;

z-index:6;

}

#answerBox.show{

opacity:1;

visibility:visible;

transform:
translateX(-50%)
translateY(0);

}

#answerText{

color:
rgba(225,245,255,.9);

font-size:15px;

line-height:1.9;

text-align:center;

direction:rtl;

white-space:pre-wrap;

word-break:break-word;

}


/* =========================
HEARD
========================= */

#heard{

position:absolute;

left:50%;
top:65%;

transform:
translateX(-50%);

width:min(700px,82vw);

text-align:center;

color:
rgba(220,242,252,.68);

font-size:14px;

line-height:1.7;

min-height:28px;

direction:rtl;

z-index:2;

transition:.35s;

}

#heard:empty{
opacity:0;
}


/* =========================
MIC
========================= */

#mic{

position:absolute;

left:50%;

bottom:6%;

transform:
translateX(-50%);

width:60px;
height:60px;

border-radius:50%;

border:
1px solid
rgba(145,220,255,.35);

background:#030a0f;

color:#d9f5ff;

display:grid;

place-items:center;

cursor:pointer;

box-shadow:
0 0 24px
rgba(80,190,255,.12);

transition:.25s;

z-index:10;

-webkit-tap-highlight-color:transparent;

}

#mic:hover,
#mic.on{

border-color:#bdeaff;

box-shadow:

0 0 34px
rgba(80,200,255,.45),

inset 0 0 18px
rgba(80,180,255,.12);

}

#mic.on{

animation:
micPulse 1.4s infinite;

}

@keyframes micPulse{

0%{
box-shadow:
0 0 18px
rgba(80,200,255,.25);
}

50%{
box-shadow:
0 0 42px
rgba(80,200,255,.65);
}

100%{
box-shadow:
0 0 18px
rgba(80,200,255,.25);
}

}

#mic svg{

width:23px;
height:23px;

fill:none;
stroke:currentColor;
stroke-width:1.5;

}


/* =========================
VOICE
========================= */

#voiceToggle{

position:absolute;

bottom:6%;
right:5%;

width:42px;
height:42px;

border-radius:50%;

border:
1px solid
rgba(145,220,255,.25);

background:#030a0f;

color:#6f9bab;

display:grid;
place-items:center;

cursor:pointer;

z-index:10;

}

#voiceToggle.active{

color:#d9f5ff;

border-color:#8ddcff;

box-shadow:
0 0 20px
rgba(80,200,255,.3);

}

#voiceToggle svg{

width:19px;
height:19px;

fill:none;
stroke:currentColor;
stroke-width:1.5;

}


/* =========================
DEVELOPMENT BUTTON
========================= */

position:absolute;

top:12%;

left:5%;

width:42px;
height:42px;

border-radius:50%;

border:
1px solid
rgba(145,220,255,.18);

color:#587582;

display:grid;
place-items:center;

cursor:pointer;

z-index:20;

transition:.25s;

}

#devButton:hover{

color:#d9f5ff;

border-color:#8ddcff;

box-shadow:
0 0 20px
rgba(80,200,255,.3);

}

#devButton svg{

width:18px;
height:18px;

fill:none;
stroke:currentColor;
stroke-width:1.4;

}


/* =========================
DEVELOPMENT PANEL
========================= */

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-48%);

width:min(760px,92vw);

max-height:82vh;

overflow:auto;

padding:22px;

border:
1px solid
rgba(130,215,255,.2);

border-radius:22px;

background:
rgba(2,8,13,.94);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

box-shadow:
0 0 80px
rgba(30,150,220,.14);

z-index:100;

opacity:0;

visibility:hidden;

transition:.3s;

}

#devPanel.show{

opacity:1;

visibility:visible;

transform:
translate(-50%,-50%);

}

#devTitle{

font-size:19px;

letter-spacing:2px;

direction:ltr;

text-align:left;

margin-bottom:7px;

}

#devSubtitle{

color:#6f8c98;

line-height:1.7;

margin-bottom:18px;

}

#devInput{

width:100%;

min-height:90px;

resize:vertical;

border:
1px solid
rgba(130,215,255,.15);

border-radius:13px;

background:#020609;

color:#e8f8ff;

padding:13px;

font-family:inherit;

font-size:14px;

outline:none;

direction:rtl;

}

#devInput:focus{

border-color:
rgba(130,215,255,.45);

box-shadow:
0 0 20px
rgba(80,190,255,.08);

}

.devButtons{

display:flex;

gap:9px;

margin-top:12px;

flex-wrap:wrap;

}

.devBtn{

border:
1px solid
rgba(130,215,255,.2);

background:#050c11;

color:#cdefff;

padding:10px 16px;

border-radius:11px;

cursor:pointer;

font-family:inherit;

}

.devBtn:hover{

border-color:#91dcff;

}

.devBtn.approve{

background:
rgba(40,130,180,.18);

border-color:
rgba(120,215,255,.45);

}

.devBtn.danger{

color:#ff9d9d;

}

#devResult{

margin-top:17px;

padding:14px;

border-radius:13px;

background:#010507;

border:
1px solid
rgba(130,215,255,.1);

font-size:13px;

line-height:1.8;

white-space:pre-wrap;

direction:rtl;

display:none;

}

#devResult.show{
display:block;
}

#devStatus{

margin-top:10px;

font-size:11px;

color:#57717d;

direction:ltr;

}


/* =========================
TIP
========================= */

#tip{

position:absolute;

bottom:2%;

left:50%;

transform:
translateX(-50%);

font-size:9px;

letter-spacing:1.5px;

direction:ltr;

white-space:nowrap;

z-index:2;

/* =========================
MOBILE
========================= */

@media(max-width:600px){

#status{

font-size:11px;
letter-spacing:2px;
top:7%;

}

#status:before,
#status:after{

margin:0 7px;

}

#memoryStatus{

font-size:8px;

}

#name{

font-size:52px;
letter-spacing:7px;

}

#app.active #name{

top:31%;
font-size:41px;

}

#answerBox{

top:51%;
width:88vw;
max-height:27vh;

}

#heard{

top:62%;
width:87vw;
font-size:13px;

}

#voiceToggle{

right:5%;
bottom:6.2%;

width:38px;
height:38px;

}

#devButton{

left:5%;
top:12%;

width:38px;
height:38px;

}

#devPanel{

width:92vw;
max-height:85vh;

padding:17px;

}

}

/* =========================
SMALL HEIGHT

@media(max-height:700px){

#status{
top:5%;
}

top:42%;
}

#app.active #name{
top:28%;
}

#answerBox{

}

}

</style>

<script>

(function(){

"use strict";


/* =========================
ELEMENTS
========================= */

const canvas =
document.getElementById("orb");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const heard =
document.getElementById("heard");

const name =
document.getElementById("name");

const mic =
document.getElementById("mic");

const app =
document.getElementById("app");

const answerBox =
document.getElementById("answerBox");

const answerText =
document.getElementById("answerText");

const voiceToggle =
document.getElementById("voiceToggle");

const memoryStatus =
document.getElementById("memoryStatus");

const devButton =
document.getElementById("devButton");

const devPanel =
document.getElementById("devPanel");

const devInput =
document.getElementById("devInput");

const devAnalyze =
document.getElementById("devAnalyze");

const devApprove =
document.getElementById("devApprove");

const devClose =
document.getElementById("devClose");

const devResult =
document.getElementById("devResult");

const devStatus =
document.getElementById("devStatus");


/* =========================
VARIABLES
========================= */

let W=0;
let H=0;
let DPR=1;

let cx=0;
let cy=0;
let R=0;

let pts=[];

let level=0;
let target=0;

let mode="idle";


/* AUDIO */

let audioCtx=null;
let analyser=null;
let audioData=null;
let stream=null;


/* SPEECH */

let recognition=null;
let recognizing=false;
let speaking=false;

let handsFree=false;
let waitingForReply=false;

let restartTimer=null;


/* VOICE */

let voiceEnabled=true;


/* MEMORY */

let conversation=[];

const MEMORY_KEY=
"ayai_conversation_memory_v3";


/* DEVELOPMENT */

let pendingDevelopment=null;


/* =========================
MEMORY
========================= */

function loadMemory(){

try{

const saved=
localStorage.getItem(
MEMORY_KEY
);

if(saved){

const parsed=
JSON.parse(saved);

if(Array.isArray(parsed)){

conversation=
parsed.slice(-40);

}

}

memoryStatus.textContent=
"MEMORY: ON";

}catch(e){

conversation=[];

memoryStatus.textContent=
"MEMORY: OFF";

}

}


function saveMemory(){

try{

localStorage.setItem(
MEMORY_KEY,
JSON.stringify(
conversation.slice(-40)
)
);

}catch(e){}

}


function clearMemory(){

conversation=[];

try{

localStorage.removeItem(
MEMORY_KEY
);

}catch(e){}

showAnswer(
"تم مسح ذاكرة المحادثة."
);

if(voiceEnabled){

speak(
"تم مسح ذاكرة المحادثة."
);

}

}


/* =========================
SCREEN
========================= */

function resize(){

DPR=
Math.min(
window.devicePixelRatio||1,
2
);

W=
window.innerWidth;

H=
window.innerHeight;


canvas.width=
Math.max(
1,
Math.floor(W*DPR)
);

canvas.height=
Math.max(
1,
Math.floor(H*DPR)
);


ctx.setTransform(
DPR,
0,
0,
DPR,
0,
0
);


cx=W/2;
cy=H/2;

R=
Math.min(W,H)*.235;

makePts();

}


function makePts(){

pts=[];

const n=
Math.max(
120,
Math.floor(
Math.min(W,H)*.38
)
);


for(
let i=0;
i<n;
i++
){

pts.push({

a:
Math.random()*
Math.PI*2,

r:
R*
(.78+
Math.random()*.29),

s:
(Math.random()-.5)*.001,

ph:
Math.random()*
Math.PI*2,

op:
.2+
Math.random()*.7,

z:
Math.random()

});

}

}


/* =========================
MODE
========================= */

function setMode(m,text){

mode=m;

status.textContent=text;

}


/* =========================
ANSWER
========================= */

function showAnswer(text){

answerText.textContent=
text||"";

answerBox.classList.add(
"show"
);

}


/* =========================
ORB
========================= */

function animate(t){

ctx.clearRect(
0,
0,
W,
H
);


const time=t*.001;

let measured=0;


if(
analyser &&
audioData
){

analyser.getByteTimeDomainData(
audioData
);

let sum=0;

for(
let i=0;
i<audioData.length;
i++
){

const v=
(audioData[i]-128)/128;

sum+=v*v;

}

measured=
Math.min(
1,
Math.sqrt(
sum/audioData.length
)*4.5
);

}


target=
Math.max(

measured,

mode==="listening"
? .035

:

mode==="speaking"
? .06

:

mode==="thinking"
? .025

:

.012

);


level+=
(target-level)*.1;


/* GLOW */

const glow=
ctx.createRadialGradient(

cx,
cy,
R*.1,

cx,
cy,
R*1.55

);

glow.addColorStop(
0,
`rgba(60,170,255,${.025+level*.09})`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*1.55,
0,
Math.PI*2
);

ctx.fill();


/* RINGS */

for(
let k=0;
k<3;
k++
){

ctx.beginPath();

ctx.arc(

cx,
cy,

R*(1+k*.035)
+
Math.sin(time*1.5+k)*2
+
level*12,

0,
Math.PI*2

);

ctx.strokeStyle=
`rgba(120,210,255,${.045+level*.025})`;

ctx.lineWidth=.6;

ctx.stroke();

}


/* PARTICLES */

for(
let i=0;
i<pts.length;
i++
){

const p=pts[i];

p.a+=
p.s*
(1+level*10);

const rr=
p.r+
Math.sin(
time*(.8+p.z*.9)+p.ph
)*
(3+level*28);

const x=
cx+
Math.cos(p.a)*rr;

const y=
cy+
Math.sin(p.a)*rr;


for(
let j=i+1;
j<Math.min(i+7,pts.length);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(
time*(.8+q.z*.9)+q.ph
)*
(3+level*28);

const qx=
cx+
Math.cos(q.a)*qrr;

const qy=
cy+
Math.sin(q.a)*qrr;

const d=
Math.hypot(
x-qx,
y-qy
);

if(d<72){

ctx.beginPath();

ctx.moveTo(x,y);
ctx.lineTo(qx,qy);

ctx.strokeStyle=
`rgba(150,225,255,${Math.max(
0,
(.17-d/520)*
(.7+level*2.3)
)})`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


ctx.beginPath();

ctx.arc(
x,
y,
p.op*.8+level*1.8,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(210,242,255,${Math.min(
1,
p.op*(.45+level*1.5)
)})`;

ctx.shadowBlur=
7+level*15;

ctx.shadowColor="#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


/* ROTATING ARCS */

for(
let k=0;
k<4;
k++
){

const a=
time*
(.18+k*.035)*
(k%2?1:-1)
+
k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(190,238,255,${.22+level*.55})`;

ctx.lineWidth=
1.1+level*2;

ctx.stroke();

}


requestAnimationFrame(
animate
);

}


/* =========================
AUDIO
========================= */

async function setupAudio(){

if(audioCtx){

if(
audioCtx.state==="suspended"
){

await audioCtx.resume();

}

return;

}


if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone unavailable"
);

}


stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});


const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;


audioCtx=new AC();

const src=
audioCtx.createMediaStreamSource(
stream
);

analyser=
audioCtx.createAnalyser();

analyser.fftSize=1024;

audioData=
new Uint8Array(
analyser.fftSize
);

src.connect(analyser);

}


/* =========================
VOICE
========================= */

function getArabicVoice(){

if(
!("speechSynthesis" in window)
)return null;

const voices=
speechSynthesis.getVoices()||[];

return

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-iq"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase()==="ar-sa"
)

||

voices.find(
v=>
(v.lang||"")
.toLowerCase().startsWith("ar")
)

||

null;

}


function speak(text){

if(!voiceEnabled){

resumeConversation();

return;

}


if(
!("speechSynthesis" in window)
){

resumeConversation();

return;

}


try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(
text
);

const voice=
getArabicVoice();

if(voice){

u.voice=voice;
u.lang=voice.lang;

}else{

u.lang="ar-SA";

}

u.rate=.9;
u.pitch=.95;
u.volume=1;

speaking=true;

app.classList.add("active");

setMode(
"speaking",
"AYAI IS SPEAKING"
);


u.onstart=()=>{

speaking=true;

app.classList.add("active");

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


u.onend=()=>{

speaking=false;

app.classList.remove("active");

if(handsFree){

waitingForReply=false;

setMode(
"listening",
"LISTENING..."
);

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


u.onerror=()=>{

speaking=false;

app.classList.remove("active");

resumeConversation();

};


speechSynthesis.speak(u);


/* iPhone */

const keepAlive=
setInterval(()=>{

if(!speaking){

clearInterval(
keepAlive
);

return;

}

try{

speechSynthesis.pause();

speechSynthesis.resume();

}catch(e){}

},10000);


}catch(e){

speaking=false;

resumeConversation();

}

}


/* =========================
NORMALIZE
========================= */

function normalizeArabic(s){

return s
.toLowerCase()

.replace(/[أإآ]/g,"ا")

.replace(/ة/g,"ه")

.replace(/[؟?!.،,]/g," ")

.replace(/\s+/g," ")

.trim();

}


/* =========================
QUICK COMMANDS
========================= */

function quickCommand(text){

const t=
normalizeArabic(text);


/* TIME */

if(
/(شكد|كم|شنو الوقت|الوقت|الساعه|الساعة)/
.test(t)
){

return `الساعة الآن ${
new Date().toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


/* DATE */

if(
/(تاريخ اليوم|شنو التاريخ|التاريخ|اليوم شنو)/
.test(t)
){

return `اليوم ${
new Date().toLocaleDateString(
"ar-IQ",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
)
}.`;

}


/* YOUTUBE */

if(
/^(افتح|شغل|روح ل)\s*(يوتيوب|youtube)/
.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";

}


/* GOOGLE */

if(
/^(افتح|روح ل)\s*(جوجل|گوگل|google)/
.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


/* SEARCH */

let m=
t.match(
/(?:ابحث|دور|ابحثلي|دورلي)(?: عن)?\s+(.+)/
);

if(m){

const q=m[1].trim();

if(q){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);

return `بحثتلك عن ${q}.`;

}

}


/* CALCULATOR */

m=
t.match(
/(?:احسب|حساب)\s+(.+)/
);

if(m){

let expr=
m[1]

.replace(/ضرب|في/g,"*")
.replace(/قسمة على|قسمه على|على/g,"/")
.replace(/زائد/g,"+")
.replace(/ناقص/g,"-")
.replace(/×/g,"*")
.replace(/÷/g,"/");

if(
/^[0-9+\-*/().\s]+$/.test(expr)
){

try{

const result=
Function(
'"use strict";return ('+
expr+
')'
)();

if(Number.isFinite(result)){

return `النتيجة هي ${result}.`;

}

}catch(e){}

}

}


/* CLEAR */

if(
/(مسح الذاكره|امسح الذاكره|انس كلشي|انسى كلشي)/
.test(t)
){

clearMemory();

return "__NO_SPEAK__";

}


return null;

}


/* =========================
AI CHAT
========================= */

async function reply(text){

const t=text.trim();

if(!t)return;


const quick=
quickCommand(t);

if(quick){

showAnswer(quick);

heard.textContent="";

if(voiceEnabled){

speak(quick);

}else{

resumeConversation();

}

return;

}


conversation.push({

role:"user",
content:t

});

saveMemory();

showAnswer("");

heard.textContent=
"جاري التفكير...";

app.classList.add("active");

setMode(
"thinking",
"AYAI IS THINKING"
);


const memoryText=
conversation
.slice(-16)
.map(
m=>
(
m.role==="user"
?
"المستخدم: "
:
"AyAI: "
)+m.content
)
.join("\n");


const prompt=

`أنت AyAI، مساعد شخصي ذكي ومتطور.

أنت تعمل كمساعد شخصي شبيه بمفهوم JARVIS،
لكن لا تدّعي أنك تستطيع تنفيذ شيء لا تملكه.

تحدث بالعربية العراقية عندما يناسب ذلك.

كن ذكياً ومباشراً.

إذا كان السؤال يحتاج شرحاً فاشرحه بوضوح.

إذا كان المستخدم يريد تطوير النظام أو تعديل الكود،
قل له إن نظام التطوير يحتاج موافقته من لوحة DEVELOPMENT CORE.

ذاكرة المحادثة:

${memoryText}

السؤال الحالي:

${t}

أجب مباشرة.`;

try{

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
message:prompt
})

});


const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"API Error"
);

}


const answer=
(
data.answer||
"ما حصلت جواب."
).trim();


conversation.push({

role:"assistant",
content:answer

});

saveMemory();

showAnswer(answer);

heard.textContent="";

if(voiceEnabled){

speak(answer);

}else{

resumeConversation();

}


}catch(error){

console.error(error);

if(
conversation.length &&
conversation[
conversation.length-1
].role==="user"
){

conversation.pop();

saveMemory();

}


const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";

showAnswer(msg);

if(voiceEnabled){

speak(msg);

}else{

resumeConversation();

}

}

}


/* =========================
SPEECH RECOGNITION
========================= */

function startRecognition(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;


if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

return;

}


if(!handsFree)return;

if(recognizing)return;


if(recognition){

try{
recognition.abort();
}catch(e){}

}


recognition=new SR();

recognition.lang="ar-IQ";

recognition.continuous=false;

recognition.interimResults=true;

recognition.maxAlternatives=1;


recognition.onstart=()=>{

recognizing=true;

waitingForReply=false;

mic.classList.add("on");

app.classList.add("active");

setMode(
"listening",
"LISTENING..."
);

heard.textContent="";

};


recognition.onresult=e=>{

let finalText="";
let interim="";


for(
let i=e.resultIndex;
i<e.results.length;
i++
){

const tx=
e.results[i][0].transcript;

if(e.results[i].isFinal){

finalText+=tx;

}else{

interim+=tx;

}

}


heard.textContent=
finalText||interim;


if(finalText){

waitingForReply=true;

try{
recognition.stop();
}catch(e){}

reply(finalText);

}

};


recognition.onerror=e=>{

recognizing=false;

mic.classList.remove("on");

if(
e.error==="not-allowed"||
e.error==="service-not-allowed"
){

handsFree=false;

setMode(
"idle",
"MICROPHONE DENIED"
);

heard.textContent=
"اسمح للمتصفح باستخدام الميكروفون.";

return;

}


if(
handsFree &&
!speaking &&
!waitingForReply
){

scheduleRecognition();

}

};


recognition.onend=()=>{

recognizing=false;

mic.classList.remove("on");

if(
handsFree &&
!speaking &&
!waitingForReply
){

scheduleRecognition();

}

};


try{

recognition.start();

}catch(e){

recognizing=false;

mic.classList.remove("on");

if(handsFree){

scheduleRecognition();

}

}

}


/* =========================
AUTO RESTART
========================= */

function scheduleRecognition(){

if(!handsFree)return;

if(recognizing)return;

if(speaking)return;


if(restartTimer){

clearTimeout(
restartTimer
);

}


restartTimer=
setTimeout(()=>{

if(
handsFree &&
!recognizing &&
!speaking &&
!waitingForReply
){

startRecognition();

}

},650);

}


/* =========================
RESUME
========================= */

function resumeConversation(){

waitingForReply=false;

if(
handsFree &&
!speaking
){

setMode(
"listening",
"LISTENING..."
);

scheduleRecognition();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =========================
UNLOCK SPEECH
========================= */

function unlockSpeech(){

if(
!("speechSynthesis" in window)
)return;

try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(" ");

u.volume=0;
u.rate=10;

speechSynthesis.speak(u);

setTimeout(
()=>{
try{
speechSynthesis.cancel();
}catch(e){}
},
100
);

}catch(e){}

}


/* =========================
VOICE BUTTON
========================= */

voiceToggle.addEventListener(
"click",
()=>{

voiceEnabled=
!voiceEnabled;

voiceToggle.classList.toggle(
"active",
voiceEnabled
);


if(!voiceEnabled){

if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}

speaking=false;

}else{

unlockSpeech();

}

}
);


/* =========================
MIC
========================= */

mic.addEventListener(
"click",
async()=>{

try{

/* STOP */

if(handsFree){

handsFree=false;

waitingForReply=false;

if(restartTimer){

clearTimeout(
restartTimer
);

restartTimer=null;

}


if(recognition){

try{
recognition.abort();
}catch(e){}

}


if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}


speaking=false;

recognizing=false;

mic.classList.remove("on");

app.classList.remove("active");

setMode(
"idle",
"AYAI IS READY"
);

heard.textContent=
"تم إيقاف الاستماع.";

return;

}


/* START */

handsFree=true;

waitingForReply=false;

unlockSpeech();

await setupAudio();

startRecognition();


}catch(e){

console.error(e);

handsFree=false;

setMode(
"idle",
"MICROPHONE ACCESS REQUIRED"
);

heard.textContent=
"فعّل صلاحية الميكروفون للمتابعة.";

}

});


/* ====================================================
DEVELOPMENT CORE
==================================================== */


/* OPEN */

devButton.addEventListener(
"click",
()=>{

devPanel.classList.add("show");

devInput.focus();

}
);


/* CLOSE */

devClose.addEventListener(
"click",
()=>{

devPanel.classList.remove(
"show"
);

}
);


/* =========================
DEVELOPMENT ANALYZE
========================= */

devAnalyze.addEventListener(
"click",
async()=>{

const request=
devInput.value.trim();

if(!request){

devStatus.textContent=
"WRITE A DEVELOPMENT REQUEST";

return;

}


devApprove.disabled=true;

pendingDevelopment=null;

devResult.classList.add("show");

devResult.textContent=
"جاري تحليل التطوير...";

devStatus.textContent=
"AYAI DEVELOPMENT CORE: ANALYZING";


try{

/*
نطلب من العقل إنشاء خطة تطوير
*/

const prompt=

`أنت مهندس تطوير برمجيات لنظام AyAI.

المستخدم يريد تطوير النظام.

طلب المستخدم:

${request}

أعطه خطة تقنية واضحة ومختصرة.

اذكر:

1. ماذا سنغير.
2. لماذا نغيره.
3. الملفات التي تحتاج تعديل.
4. المخاطر المحتملة.
5. النتيجة بعد التطوير.

مهم:
لا تطبق أي تعديل.
فقط اقترح الخطة.

أجب بالعربية.`;

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
message:prompt
})

});


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error||
"Analysis failed"
);

}


pendingDevelopment={
request:request,
plan:data.answer||""
};


devResult.textContent=
`DEVELOPMENT PROPOSAL

${data.answer}

--------------------------------

لن يتم تعديل أي ملف الآن.

اضغط APPROVE & APPLY فقط إذا كنت موافقاً.`;

devApprove.disabled=false;

devStatus.textContent=
"WAITING FOR YOUR APPROVAL";


}catch(error){

console.error(error);

devResult.textContent=
"فشل تحليل التطوير:\n"+
error.message;

devStatus.textContent=
"DEVELOPMENT ANALYSIS FAILED";

}

}
);


/* =========================
APPROVE
========================= */

devApprove.addEventListener(
"click",
async()=>{

if(!pendingDevelopment){

return;

}


const approved=
confirm(
"هل أنت متأكد من السماح لـ AyAI بتنفيذ التطوير؟"
);

if(!approved){

return;

}


devApprove.disabled=true;

devAnalyze.disabled=true;

devStatus.textContent=
"DEVELOPMENT APPROVED";


devResult.textContent+=
"\n\nجاري تجهيز التعديل...";


try{

/*
حالياً نرسل طلب التطوير إلى السيرفر.

السيرفر لن يعدل إلا الملفات الموجودة
داخل AYAI_ALLOWED_PATHS.
*/

const response=
await fetch(
"/api/develop",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

action:"propose",

message:
pendingDevelopment.request,

approved:true

})

});


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error||
"Development failed"
);

}


if(data.plan){

devResult.textContent=
`DEVELOPMENT RESULT

${data.plan}

--------------------------------

تم قبول طلب التطوير.
`;

}else{

devResult.textContent+=
"\n\n"+JSON.stringify(
data,
null,
2
);

}


devStatus.textContent=
"DEVELOPMENT REQUEST PROCESSED";


}catch(error){

console.error(error);

devResult.textContent+=
"\n\nERROR:\n"+
error.message;

devStatus.textContent=
"DEVELOPMENT FAILED";

}finally{

devAnalyze.disabled=false;

}

}
);


/* =========================
INITIALIZE
========================= */

loadMemory();


if(
"speechSynthesis" in window
){

speechSynthesis.getVoices();

speechSynthesis.onvoiceschanged=
()=>{

speechSynthesis.getVoices();

};

}


voiceToggle.classList.add(
"active"
);


window.addEventListener(
"resize",
resize,
{passive:true}
);


resize();

requestAnimationFrame(
animate
);


})();

</script>
