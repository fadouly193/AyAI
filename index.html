<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AyAI — Voice Assistant</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#eef9ff;
font-family:Inter,"Segoe UI",Arial,sans-serif;
}

body{
min-height:100dvh;
}

#app{
width:100%;
height:100%;
min-height:100dvh;
position:relative;
background:#000;
overflow:hidden;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
transition:transform .7s cubic-bezier(.2,.8,.2,1);
}

#status{
position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
direction:ltr;
font-size:17px;
letter-spacing:3px;
font-weight:300;
white-space:nowrap;
text-shadow:0 0 18px #78cfff;
transition:.35s;
z-index:5;
}

#status:before,
#status:after{
content:"";
display:inline-block;
width:65px;
height:1px;
vertical-align:middle;
margin:0 17px;
background:linear-gradient(90deg,transparent,#72caff);
}

#status:after{
background:linear-gradient(90deg,#72caff,transparent);
}

#name{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:clamp(45px,7vw,88px);
font-weight:200;
letter-spacing:9px;
direction:ltr;
text-shadow:0 0 25px rgba(130,210,255,.65);
pointer-events:none;
z-index:4;
transition:
top .7s cubic-bezier(.2,.8,.2,1),
transform .7s cubic-bezier(.2,.8,.2,1),
font-size .7s cubic-bezier(.2,.8,.2,1),
text-shadow .5s;
}

#heard{
position:absolute;
left:50%;
top:65%;
transform:translateX(-50%);
width:min(700px,82vw);
text-align:center;
color:rgba(220,242,252,.78);
font-size:15px;
line-height:1.7;
min-height:28px;
direction:rtl;
z-index:6;
transition:.5s;
}

#answerBox{
position:absolute;
left:50%;
top:63%;
transform:translate(-50%,20px);
width:min(760px,88vw);
max-height:23vh;
overflow:auto;
padding:18px 20px;
border:1px solid rgba(120,210,255,.18);
border-radius:18px;
background:
linear-gradient(
180deg,
rgba(5,15,21,.88),
rgba(2,7,10,.76)
);
box-shadow:
0 0 35px rgba(50,180,255,.08),
inset 0 0 25px rgba(100,200,255,.025);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
color:#dff6ff;
font-size:15px;
line-height:1.9;
opacity:0;
pointer-events:none;
transition:
opacity .45s ease,
transform .55s cubic-bezier(.2,.8,.2,1);
z-index:7;
}

#answerBox.show{
opacity:1;
transform:translate(-50%,0);
pointer-events:auto;
}

#answerBox::-webkit-scrollbar{
width:3px;
}

#answerBox::-webkit-scrollbar-thumb{
background:#28566a;
border-radius:10px;
}

/* عند ظهور الجواب */
#app.answer-mode #name{
top:31%;
font-size:clamp(34px,5vw,62px);
text-shadow:0 0 18px rgba(130,210,255,.5);
}

#app.answer-mode canvas{
transform:translateY(-19%);
}

#app.answer-mode #heard{
top:43%;
}

#mic{
position:absolute;
left:50%;
bottom:7%;
transform:translateX(-50%);
width:58px;
height:58px;
border-radius:50%;
border:1px solid rgba(145,220,255,.35);
background:#030a0f;
color:#d9f5ff;
display:grid;
place-items:center;
cursor:pointer;
box-shadow:0 0 24px rgba(80,190,255,.12);
transition:.25s;
z-index:10;
-webkit-tap-highlight-color:transparent;
}

#mic:hover,
#mic.on{
border-color:#bdeaff;
box-shadow:
0 0 34px rgba(80,200,255,.45),
inset 0 0 18px rgba(80,180,255,.12);
}

#mic svg{
width:23px;
height:23px;
fill:none;
stroke:currentColor;
stroke-width:1.5;
}

#voiceToggle{
position:absolute;
left:50%;
bottom:16%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:9px;
padding:8px 13px;
border:1px solid rgba(120,210,255,.18);
border-radius:30px;
background:rgba(3,10,15,.7);
color:#7293a2;
font-size:11px;
letter-spacing:1px;
cursor:pointer;
z-index:10;
transition:.25s;
-webkit-tap-highlight-color:transparent;
}

#voiceToggle.on{
color:#c9f1ff;
border-color:rgba(120,210,255,.45);
box-shadow:0 0 18px rgba(80,190,255,.12);
}

.voice-dot{
width:7px;
height:7px;
border-radius:50%;
background:#3a5968;
box-shadow:none;
transition:.25s;
}

#voiceToggle.on .voice-dot{
background:#8fe0ff;
box-shadow:0 0 10px #67cfff;
}

#tip{
position:absolute;
bottom:2%;
left:50%;
transform:translateX(-50%);
font-size:10px;
letter-spacing:1.7px;
color:#53707e;
direction:ltr;
white-space:nowrap;
z-index:5;
}

#memory{
position:absolute;
right:18px;
top:24%;
font-size:11px;
letter-spacing:1px;
color:#315565;
direction:ltr;
z-index:5;
transition:.25s;
}

@media(max-width:600px){

#status{
font-size:12px;
letter-spacing:2px;
top:7%;
}

#status:before,
#status:after{
width:28px;
margin:0 8px;
}

#name{
font-size:52px;
letter-spacing:7px;
}

#heard{
top:64%;
width:86vw;
font-size:14px;
}

#answerBox{
top:51%;
width:88vw;
max-height:24vh;
font-size:14px;
padding:14px 16px;
}

#app.answer-mode #name{
top:29%;
font-size:40px;
}

#app.answer-mode canvas{
transform:translateY(-20%);
}

#app.answer-mode #heard{
top:39%;
}

#voiceToggle{
bottom:15%;
font-size:10px;
}

#tip{
font-size:8px;
letter-spacing:1.1px;
}

#memory{
right:16px;
top:22%;
font-size:9px;
}

}
</style>
</head>

<body>

<div id="app">

<canvas id="orb"></canvas>

<div id="status">AYAI IS READY</div>

<div id="memory">MEMORY: ON</div>

<div id="name">AyAI</div>

<div id="heard"></div>

<div id="answerBox"></div>

<button id="voiceToggle" type="button">
<span class="voice-dot"></span>
<span id="voiceText">VOICE: ON</span>
</button>

<button id="mic" type="button" aria-label="Start AyAI">

<svg viewBox="0 0 24 24" aria-hidden="true">
<rect x="9" y="3" width="6" height="11" rx="3"/>
<path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"/>
</svg>

</button>

<div id="tip">
TAP TO SPEAK • TALK TO AYAI
</div>

</div>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const app=document.getElementById("app");
const canvas=document.getElementById("orb");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");
const heard=document.getElementById("heard");
const answerBox=document.getElementById("answerBox");

const mic=document.getElementById("mic");

const voiceToggle=
document.getElementById("voiceToggle");

const voiceText=
document.getElementById("voiceText");


/* =========================
   VARIABLES
========================= */

let W=0;
let H=0;
let DPR=1;

let cx=0;
let cy=0;
let R=0;

let pts=[];

let level=0;
let target=0;

let mode="idle";

let audioCtx=null;
let analyser=null;
let audioData=null;
let stream=null;

let recognition=null;

let recognizing=false;
let speaking=false;

let voiceEnabled=true;


/* =========================
   MEMORY
========================= */

let conversation=[];

function loadMemory(){

try{

const saved=
localStorage.getItem("ayai_memory");

if(saved){

conversation=
JSON.parse(saved);

if(!Array.isArray(conversation)){
conversation=[];
}

}

}catch(e){

conversation=[];

}

}


function saveMemory(){

try{

localStorage.setItem(
"ayai_memory",
JSON.stringify(
conversation.slice(-30)
)
);

}catch(e){}

}


function clearMemory(){

conversation=[];

saveMemory();

}


/* =========================
   SCREEN
========================= */

function resize(){

DPR=Math.min(
window.devicePixelRatio||1,
2
);

W=window.innerWidth;
H=window.innerHeight;

canvas.width=
Math.max(
1,
Math.floor(W*DPR)
);

canvas.height=
Math.max(
1,
Math.floor(H*DPR)
);

ctx.setTransform(
DPR,
0,
0,
DPR,
0,
0
);

cx=W/2;
cy=H/2;

R=Math.min(W,H)*.235;

makePts();

}


function makePts(){

pts=[];

const n=Math.max(
120,
Math.floor(Math.min(W,H)*.38)
);

for(let i=0;i<n;i++){

pts.push({

a:Math.random()*Math.PI*2,

r:R*(.78+Math.random()*.29),

s:(Math.random()-.5)*.001,

ph:Math.random()*Math.PI*2,

op:.2+Math.random()*.7,

z:Math.random()

});

}

}


function setMode(m,text){

mode=m;

status.textContent=text;

}


/* =========================
   ANSWER UI
========================= */

function showAnswer(text){

answerBox.textContent=text;

app.classList.add("answer-mode");

}

function hideAnswer(){

answerBox.classList.remove("show");

}

function showAnswerBox(text){

answerBox.textContent=text;

app.classList.add("answer-mode");

requestAnimationFrame(()=>{

answerBox.classList.add("show");

});

}


/* =========================
   AYAI ORB
========================= */

function animate(t){

ctx.clearRect(
0,
0,
W,
H
);

const time=t*.001;

let measured=0;

if(analyser&&audioData){

analyser.getByteTimeDomainData(
audioData
);

let sum=0;

for(
let i=0;
i<audioData.length;
i++
){

const v=
(audioData[i]-128)/128;

sum+=v*v;

}

measured=Math.min(
1,
Math.sqrt(
sum/audioData.length
)*4.5
);

}


target=Math.max(

measured,

mode==="listening"
? .035

:

mode==="speaking"
? .06

:

mode==="thinking"
? .025

:

.012

);


level+=
(target-level)*.1;


/* glow */

const glow=
ctx.createRadialGradient(
cx,
cy,
R*.1,
cx,
cy,
R*1.55
);

glow.addColorStop(
0,
`rgba(60,170,255,${.025+level*.09})`
);

glow.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*1.55,
0,
Math.PI*2
);

ctx.fill();


/* rings */

for(
let k=0;
k<3;
k++
){

ctx.beginPath();

ctx.arc(

cx,
cy,

R*(1+k*.035)
+
Math.sin(time*1.5+k)*2
+
level*12,

0,
Math.PI*2

);

ctx.strokeStyle=
`rgba(120,210,255,${.045+level*.025})`;

ctx.lineWidth=.6;

ctx.stroke();

}


/* particles */

for(
let i=0;
i<pts.length;
i++
){

const p=pts[i];

p.a+=
p.s*
(1+level*10);

const rr=
p.r+
Math.sin(
time*(.8+p.z*.9)+p.ph
)*
(3+level*28);

const x=
cx+
Math.cos(p.a)*rr;

const y=
cy+
Math.sin(p.a)*rr;


/* connections */

for(
let j=i+1;
j<Math.min(i+7,pts.length);
j++
){

const q=pts[j];

const qrr=
q.r+
Math.sin(
time*(.8+q.z*.9)+q.ph
)*
(3+level*28);

const qx=
cx+
Math.cos(q.a)*qrr;

const qy=
cy+
Math.sin(q.a)*qrr;

const d=
Math.hypot(
x-qx,
y-qy
);

if(d<72){

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
qx,
qy
);

ctx.strokeStyle=
`rgba(150,225,255,${Math.max(
0,
(.17-d/520)*
(.7+level*2.3)
)})`;

ctx.lineWidth=.45;

ctx.stroke();

}

}


/* particle */

ctx.beginPath();

ctx.arc(
x,
y,
p.op*.8+level*1.8,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(210,242,255,${Math.min(
1,
p.op*(.45+level*1.5)
)})`;

ctx.shadowBlur=
7+level*15;

ctx.shadowColor=
"#79cfff";

ctx.fill();

ctx.shadowBlur=0;

}


/* rotating arcs */

for(
let k=0;
k<4;
k++
){

const a=
time*
(.18+k*.035)*
(k%2?1:-1)
+
k*1.6;

ctx.beginPath();

ctx.arc(
cx,
cy,
R*(1.01+level*.03),
a,
a+.65+level*1.1
);

ctx.strokeStyle=
`rgba(190,238,255,${.22+level*.55})`;

ctx.lineWidth=
1.1+level*2;

ctx.stroke();

}


requestAnimationFrame(
animate
);

}


/* =========================
   MICROPHONE
========================= */

async function setupAudio(){

if(audioCtx){

if(audioCtx.state==="suspended"){

await audioCtx.resume();

}

return;

}

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone unavailable"
);

}

stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

audioCtx=new AC();

const src=
audioCtx.createMediaStreamSource(
stream
);

analyser=
audioCtx.createAnalyser();

analyser.fftSize=1024;

audioData=
new Uint8Array(
analyser.fftSize
);

src.connect(analyser);

}


/* =========================
   ARABIC VOICE
========================= */

function getArabicVoice(){

if(
!("speechSynthesis"in window)
){

return null;

}

const voices=
speechSynthesis.getVoices()||[];

return

voices.find(v=>
(v.lang||"")
.toLowerCase()==="ar-iq"
)

||

voices.find(v=>
(v.lang||"")
.toLowerCase()==="ar-sa"
)

||

voices.find(v=>
(v.lang||"")
.toLowerCase()==="ar-ae"
)

||

voices.find(v=>
(v.lang||"")
.toLowerCase()
.startsWith("ar")
)

||

null;

}


/* =========================
   SPEAK
========================= */

function speak(text){

if(!voiceEnabled){

speaking=false;

setMode(
"idle",
"AYAI IS READY"
);

return;

}

if(
!("speechSynthesis"in window)
){

setMode(
"idle",
"VOICE NOT AVAILABLE"
);

return;

}

try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(
text
);

const voice=
getArabicVoice();

if(voice){

u.voice=voice;

u.lang=voice.lang;

}else{

u.lang="ar-SA";

}

u.rate=.9;

u.pitch=.95;

u.volume=1;

speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);


u.onstart=()=>{

speaking=true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


u.onend=()=>{

speaking=false;

if(!recognizing){

setMode(
"idle",
"AYAI IS READY"
);

}

};


u.onerror=(e)=>{

console.log(
"TTS error",
e
);

speaking=false;

if(!recognizing){

setMode(
"idle",
"AYAI IS READY"
);

}

};


speechSynthesis.speak(u);


/* iPhone Safari keep alive */

const keepAlive=
setInterval(()=>{

if(!speaking){

clearInterval(
keepAlive
);

return;

}

try{

speechSynthesis.pause();

speechSynthesis.resume();

}catch(e){}

},9000);


}catch(e){

console.error(e);

speaking=false;

setMode(
"idle",
"AYAI IS READY"
);

}

}


/* =========================
   MOBILE AUDIO UNLOCK
========================= */

function unlockSpeech(){

if(
!("speechSynthesis"in window)
)return;

try{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(" ");

u.volume=0;

u.rate=10;

speechSynthesis.speak(u);

setTimeout(()=>{

try{

speechSynthesis.cancel();

}catch(e){}

},100);

}catch(e){}

}


/* =========================
   NORMALIZE
========================= */

function normalizeArabic(s){

return s
.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ة/g,"ه")
.replace(/[؟?!.،,]/g," ")
.replace(/\s+/g," ")
.trim();

}


/* =========================
   QUICK COMMANDS
========================= */

function quickCommand(text){

const t=
normalizeArabic(text);


/* الوقت */

if(
/(شكد الوقت|كم الوقت|شنو الوقت|الوقت|الساعه|الساعة)/.test(t)
){

const now=
new Date();

return `الساعة الآن ${
now.toLocaleTimeString(
"ar-IQ",
{
hour:"numeric",
minute:"2-digit"
}
)
}.`;

}


/* التاريخ */

if(
/(تاريخ اليوم|شنو التاريخ|التاريخ|اليوم شنو)/.test(t)
){

const now=
new Date();

return `اليوم ${
now.toLocaleDateString(
"ar-IQ",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
)
}.`;

}


/* يوتيوب */

if(
/^(افتح|شغل|روح ل|ادخل)(\s+)?(يوتيوب|youtube)/.test(t)
){

window.open(
"https://www.youtube.com",
"_blank"
);

return "فتحتلك يوتيوب.";

}


/* Google */

if(
/^(افتح|روح ل|ادخل)(\s+)?(جوجل|گوگل|google)/.test(t)
){

window.open(
"https://www.google.com",
"_blank"
);

return "فتحتلك Google.";

}


/* البحث */

let m=
t.match(
/(?:ابحث|دور|ابحثلي|دورلي)(?: عن)?\s+(.+)/
);

if(m){

const q=
m[1].trim();

if(q){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);

return `بحثتلك عن ${q}.`;

}

}


/* الحساب */

m=
t.match(
/(?:احسب|حساب)\s+(.+)/
);

if(m){

let expr=
m[1]

.replace(/ضرب|في/g,"*")
.replace(/قسمة على|قسمه على/g,"/")
.replace(/\sعلى\s/g,"/")
.replace(/زائد/g,"+")
.replace(/ناقص/g,"-")
.replace(/×/g,"*")
.replace(/÷/g,"/");

if(
/^[0-9+\-*/().\s]+$/.test(expr)
){

try{

const result=
Function(
'"use strict";return ('+
expr+
')'
)();

if(Number.isFinite(result)){

return `النتيجة هي ${result}.`;

}

}catch(e){}

}

}


/* مسح الذاكرة */

if(
/(مسح الذاكره|امسح الذاكره|انس كلشي|انسى كلشي)/.test(t)
){

clearMemory();

return "__MEMORY_CLEARED__";

}


return null;

}


/* =========================
   AI CHAT
========================= */

async function reply(text){

const t=
text.trim();

if(!t)return;


/* quick command */

const quick=
quickCommand(t);

if(quick){

if(
quick==="__MEMORY_CLEARED__"
){

showAnswerBox(
"تم مسح ذاكرة المحادثة."
);

heard.textContent=
"تم مسح الذاكرة.";

speak(
"تم مسح ذاكرة المحادثة."
);

return;

}


showAnswerBox(
quick
);

heard.textContent=
"";

speak(
quick
);

return;

}


/* save user */

conversation.push({
role:"user",
content:t
});

saveMemory();


heard.textContent=
"جاري التفكير...";

answerBox.classList.remove("show");

app.classList.add("answer-mode");

setMode(
"thinking",
"AYAI IS THINKING"
);


/* memory */

const memoryText=
conversation
.slice(-12)
.map(m=>
(m.role==="user"
?"المستخدم: "
:"AyAI: ")
+
m.content
)
.join("\n");


const prompt=

`أنت AyAI، مساعد شخصي ذكي وودود.

تحدث بالعربية، ويمكنك استخدام اللهجة العراقية بشكل طبيعي.

كن مختصراً في الأسئلة البسيطة وواضحاً في الأسئلة المعقدة.

هذه ذاكرة المحادثة:

${memoryText}

السؤال الحالي:

${t}

أجب مباشرة عن السؤال الحالي.`;


try{

const response=
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
message:prompt
})

});


const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"API Error"
);

}


const answer=
(
data.answer||
"ما حصلت جواب."
)
.trim();


conversation.push({
role:"assistant",
content:answer
});

saveMemory();


showAnswerBox(
answer
);

heard.textContent="";


/*
  التأخير البسيط مهم على iPhone
  حتى يشتغل الصوت بشكل أفضل
*/

if(voiceEnabled){

setTimeout(()=>{

speak(answer);

},120);

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

}catch(error){

console.error(error);


/* حذف آخر رسالة مستخدم */

if(
conversation.length&&
conversation[
conversation.length-1
].role==="user"
){

conversation.pop();

saveMemory();

}


const msg=
"صار خطأ بالاتصال بالذكاء الاصطناعي. حاول مرة ثانية.";

showAnswerBox(
msg
);

heard.textContent="";

speak(msg);

}

}


/* =========================
   CONTINUOUS CONVERSATION
========================= */

let handsFree = false;
let waitingForReply = false;
let restartTimer = null;


/* =========================
   SPEECH RECOGNITION
========================= */

function startRecognition(){

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

setMode(
"idle",
"VOICE NOT SUPPORTED"
);

heard.textContent =
"المتصفح الحالي لا يدعم التعرف على الصوت.";

return;

}


/* إذا وضع المحادثة مغلق لا تبدأ */

if(!handsFree){

return;

}


if(recognition){

try{
recognition.abort();
}catch(e){}

}


recognition = new SR();

recognition.lang = "ar-IQ";

recognition.continuous = false;

recognition.interimResults = true;

recognition.maxAlternatives = 1;


/* =========================
   START
========================= */

recognition.onstart = ()=>{

recognizing = true;

mic.classList.add("on");

setMode(
"listening",
"LISTENING..."
);

heard.textContent = "";

};


/* =========================
   RESULT
========================= */

recognition.onresult = e => {

let finalText = "";
let interim = "";


for(
let i = e.resultIndex;
i < e.results.length;
i++
){

const tx =
e.results[i][0].transcript;

if(e.results[i].isFinal){

finalText += tx;

}else{

interim += tx;

}

}


heard.textContent =
finalText || interim;


/*
   بمجرد الحصول على الجملة النهائية
   نوقف الاستماع مؤقتاً حتى لا يسمع
   AyAI نفسه وهو يتكلم.
*/

if(finalText){

waitingForReply = true;

try{

recognition.stop();

}catch(e){}


/*
   نرسل السؤال للـ AI
*/

reply(finalText);

}

};


/* =========================
   ERROR
========================= */

recognition.onerror = e => {

recognizing = false;

mic.classList.remove("on");


if(
e.error === "not-allowed" ||
e.error === "service-not-allowed"
){

handsFree = false;

setMode(
"idle",
"MICROPHONE DENIED"
);

heard.textContent =
"اسمح للمتصفح باستخدام الميكروفون.";

return;

}


/*
   إذا صار خطأ عابر
   يرجع يستمع تلقائياً
*/

if(handsFree && !speaking){

scheduleRecognition();

}

};


/* =========================
   END
========================= */

recognition.onend = ()=>{

recognizing = false;

mic.classList.remove("on");


/*
   إذا المستخدم يريد محادثة مستمرة
   وماكو جواب صوتي حالياً
*/

if(
handsFree &&
!speaking &&
!waitingForReply
){

scheduleRecognition();

}

};


/* =========================
   START SAFELY
========================= */

try{

recognition.start();

}catch(e){

recognizing = false;

mic.classList.remove("on");

if(handsFree){

scheduleRecognition();

}

}

}


/* =========================
   AUTO RESTART
========================= */

function scheduleRecognition(){

if(!handsFree) return;

if(recognizing) return;

if(speaking) return;

if(restartTimer){

clearTimeout(restartTimer);

}

restartTimer = setTimeout(()=>{

if(
handsFree &&
!recognizing &&
!speaking
){

startRecognition();

}

},500);

}


/* =========================
   START LISTENING AGAIN
========================= */

function resumeConversation(){

waitingForReply = false;

if(
handsFree &&
!speaking
){

scheduleRecognition();

}

}


/* =========================
   VOICE
========================= */

function speak(text){

if(
!("speechSynthesis" in window)
){

setMode(
"idle",
"VOICE NOT AVAILABLE"
);

resumeConversation();

return;

}


try{

speechSynthesis.cancel();

const u =
new SpeechSynthesisUtterance(text);

const voice =
getArabicVoice();

if(voice){

u.voice = voice;

u.lang = voice.lang;

}else{

u.lang = "ar-SA";

}

u.rate = .9;

u.pitch = .95;

u.volume = 1;

speaking = true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);


/* =========================
   SPEECH START
========================= */

u.onstart = ()=>{

speaking = true;

setMode(
"speaking",
"AYAI IS SPEAKING"
);

};


/* =========================
   SPEECH END
========================= */

u.onend = ()=>{

speaking = false;

if(handsFree){

setMode(
"listening",
"LISTENING..."
);

resumeConversation();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


/* =========================
   SPEECH ERROR
========================= */

u.onerror = ()=>{

speaking = false;

if(handsFree){

resumeConversation();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

};


speechSynthesis.speak(u);


/*
   حماية من توقف SpeechSynthesis
   على بعض أجهزة iPhone
*/

const keepAlive =
setInterval(()=>{

if(!speaking){

clearInterval(keepAlive);

return;

}

try{

speechSynthesis.pause();

speechSynthesis.resume();

}catch(e){}

},10000);


}catch(e){

speaking = false;

if(handsFree){

resumeConversation();

}else{

setMode(
"idle",
"AYAI IS READY"
);

}

}

}


/* =========================
   MIC BUTTON
========================= */

mic.addEventListener(
"click",
async()=>{

try{

/*
   إذا كان يستمع:
   الدوسة الثانية = إيقاف المحادثة
*/

if(handsFree){

handsFree = false;

waitingForReply = false;

if(restartTimer){

clearTimeout(restartTimer);

restartTimer = null;

}

if(recognition){

try{

recognition.abort();

}catch(e){}

}

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

speaking = false;

recognizing = false;

mic.classList.remove("on");

setMode(
"idle",
"AYAI IS READY"
);

heard.textContent =
"تم إيقاف الاستماع.";

return;

}


/*
   أول ضغطة:
   تشغيل وضع المحادثة المستمرة
*/

handsFree = true;

waitingForReply = false;


/*
   فتح صلاحية الصوت
*/

unlockSpeech();


if("speechSynthesis" in window){

speechSynthesis.cancel();

}


/*
   تشغيل المايك
*/

await setupAudio();


/*
   يبدأ الاستماع
*/

startRecognition();


}catch(e){

console.error(e);

handsFree = false;

setMode(
"idle",
"MICROPHONE ACCESS REQUIRED"
);

heard.textContent =
"فعّل صلاحية الميكروفون للمتابعة.";

}

});

/* =========================
   START
========================= */

loadMemory();

updateVoiceButton();

window.addEventListener(
"resize",
resize,
{passive:true}
);

resize();

requestAnimationFrame(
animate
);

})();

</script>
